<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>岭南小歌星 — 齐齐望过去</title>
<style>
:root {
  --red: #C41E3A; --gold: #D4A843; --green: #5B8C5A;
  --cream: #FFF8EC; --dark: #3D2C2C; --pink: #FFAB91;
  --blue: #5B9BD5; --orange: #F4A460;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans HK',sans-serif;
  background: linear-gradient(180deg, #FFF8EC 0%, #FFE8D6 50%, #FFD4B8 100%);
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.page { display:none; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh; padding:20px 16px; }
.page.active { display:flex; }

/* ===== Welcome ===== */
.welcome-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.welcome-bg .circle1 { position:absolute; top:-80px; right:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,171,145,0.25); }
.welcome-bg .circle2 { position:absolute; bottom:-40px; left:-50px; width:180px; height:180px; border-radius:50%; background:rgba(212,168,67,0.18); }
.welcome-inner { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
.welcome-animals { font-size:48px; letter-spacing:8px; margin-bottom:12px; animation: bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.title-card {
  background:#fff; border-radius:24px; padding:24px 32px;
  box-shadow: 0 8px 32px rgba(196,30,58,0.12);
  text-align:center; margin-bottom:20px;
}
.title-card .decor-line { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.title-card .decor-line span { font-size:22px; }
.title-main { font-size:34px; font-weight:900; color:var(--red); letter-spacing:4px; }
.title-sub { font-size:14px; color:var(--gold); font-weight:700; margin-top:4px; letter-spacing:2px; }
.step-preview { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
.step-dot {
  width:48px; height:48px; border-radius:50%; background:#fff;
  border:3px dashed #ddd; display:flex; align-items:center; justify-content:center;
  font-size:22px; transition:all 0.4s;
}
.step-dot.done { border-color:var(--gold); background:#FFF9E6; box-shadow:0 0 12px rgba(212,168,67,0.3); }
.btn-start {
  background:linear-gradient(135deg, #C41E3A, #E63946);
  color:#fff; border:none; padding:18px 60px; font-size:22px; font-weight:700;
  border-radius:50px; letter-spacing:3px; cursor:pointer;
  box-shadow:0 6px 24px rgba(196,30,58,0.4);
  transition:transform 0.15s;
}
.btn-start:active { transform:scale(0.95); }

/* ===== Step Header ===== */
.step-header { width:100%; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.btn-back { background:#fff; border:2px solid #eee; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.step-indicator { flex:1; text-align:center; font-size:15px; font-weight:700; color:var(--red); letter-spacing:2px; }
.fragments-mini { display:flex; gap:6px; }
.frag-mini { width:24px; height:24px; border-radius:50%; border:2px dashed #ddd; background:#f9f9f9; transition:all 0.4s; font-size:12px; display:flex; align-items:center; justify-content:center; }
.frag-mini.got { border-color:var(--gold); background:#FFF9E6; box-shadow:0 0 8px rgba(212,168,67,0.3); }

/* ===== Step 1: Read ===== */
.vocab-card {
  width:100%; background:#fff; border-radius:20px; padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,0.06); text-align:center;
  margin-bottom:16px;
}
.vocab-img { width:160px; height:160px; object-fit:contain; margin:0 auto 12px; display:block; }
.vocab-word { font-size:22px; font-weight:900; color:var(--dark); letter-spacing:3px; }
.vocab-counter { font-size:13px; color:#999; margin-top:6px; }
.vocab-nav { display:flex; gap:16px; align-items:center; margin-bottom:20px; }
.vocab-nav button { background:#fff; border:2px solid #eee; border-radius:50%; width:44px; height:44px; font-size:20px; cursor:pointer; }

/* ===== Step 2 & 3: Sing Along & Echo ===== */
.animal-display {
  width:100%; border-radius:20px; overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.1); margin-bottom:12px;
  aspect-ratio:16/10; position:relative;
}
.animal-display img { width:100%; height:100%; object-fit:cover; }
.animal-label {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent, rgba(0,0,0,0.5));
  color:#fff; padding:20px 16px 12px; font-size:16px; font-weight:700;
  text-align:center; letter-spacing:2px;
}
.lyric-mini {
  width:100%; display:flex; gap:6px; margin-bottom:8px; justify-content:center; flex-wrap:wrap;
}
.lyric-dot {
  padding:6px 14px; border-radius:20px; background:#f0f0f0;
  font-size:13px; color:#999; font-weight:600; transition:all 0.3s;
}
.lyric-dot.active { background:var(--red); color:#fff; }

/* ===== Step 4: Full Song ===== */
.mode-choose { display:flex; gap:12px; margin-bottom:16px; width:100%; }
.mode-btn {
  flex:1; padding:12px 8px; border-radius:16px; border:3px solid #eee;
  background:#fff; text-align:center; cursor:pointer; transition:all 0.2s;
  font-size:14px; font-weight:700; line-height:1.4;
}
.mode-btn.selected { border-color:var(--red); background:#FFF5F5; }

/* ===== Recording Controls (shared) ===== */
.record-section { width:100%; text-align:center; }
.btn-record {
  width:80px; height:80px; border-radius:50%; border:none;
  background:linear-gradient(135deg, #C41E3A, #E63946);
  color:#fff; font-size:32px; cursor:pointer;
  box-shadow:0 6px 20px rgba(196,30,58,0.35);
  transition:all 0.2s;
}
.btn-record:active { transform:scale(0.9); }
.btn-record.recording {
  animation:recordPulse 0.8s ease-in-out infinite;
  background:linear-gradient(135deg, #ff1744, #ff5252);
}
@keyframes recordPulse {
  0% { box-shadow:0 0 0 0 rgba(255,23,68,0.5); }
  100% { box-shadow:0 0 0 28px rgba(255,23,68,0); }
}
.record-hint { font-size:14px; color:#888; margin-top:8px; }
.record-timer { font-size:12px; color:#aaa; margin-top:4px; }

.btn-action {
  margin-top:12px; padding:12px 36px; border-radius:25px;
  font-size:16px; font-weight:700; cursor:pointer; border:none;
  letter-spacing:1px;
}
.btn-primary { background:var(--red); color:#fff; box-shadow:0 4px 12px rgba(196,30,58,0.3); }
.btn-gold { background:var(--gold); color:#fff; box-shadow:0 4px 12px rgba(212,168,67,0.3); }
.btn-outline { background:#fff; color:var(--red); border:2px solid var(--red); }
.btn:disabled { opacity:0.4; pointer-events:none; }

/* ===== Badge Page ===== */
.badge-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; background:linear-gradient(180deg, #FFF9E6, #FFE8D6); }
.badge-inner { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.badge-img { width:260px; height:260px; object-fit:contain; border-radius:50%; box-shadow:0 8px 40px rgba(212,168,67,0.4); animation: popIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes popIn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
.badge-name { font-size:28px; font-weight:900; color:var(--red); margin-top:16px; letter-spacing:3px; }
.badge-desc { font-size:14px; color:#888; margin:6px 0 16px; }

.confetti-wrap { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.confetti { position:absolute; width:10px; height:10px; border-radius:2px; animation:confettiFall linear forwards; }
@keyframes confettiFall {
  0%{transform:translateY(-100px) rotate(0deg); opacity:1}
  100%{transform:translateY(105vh) rotate(720deg); opacity:0}
}

/* ===== Fragment Unlock Animation ===== */
.fragment-popup {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
  width:120px; height:120px; border-radius:24px;
  display:flex; align-items:center; justify-content:center;
  font-size:60px; z-index:1000; pointer-events:none;
  animation: fragPop 1.2s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
@keyframes fragPop {
  0%  {transform:translate(-50%,-50%) scale(0); opacity:0;}
  30% {transform:translate(-50%,-50%) scale(1.4); opacity:1;}
  60% {transform:translate(-50%,-50%) scale(0.95); opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1); opacity:0;}
}
.fragment-popup .sparkle {
  position:absolute; width:8px; height:8px; border-radius:50%;
  animation: sparkleBurst 0.8s ease-out forwards;
}
@keyframes sparkleBurst {
  0%  {transform:translate(0,0) scale(1); opacity:1;}
  100%{transform:translate(var(--sx),var(--sy)) scale(0); opacity:0;}
}

/* ===== Badge Glow ===== */
.badge-glow {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle, rgba(212,168,67,0.4) 0%, rgba(255,215,0,0.2) 30%, transparent 60%);
  animation: glowPulse 1.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glowPulse {
  0%,100%{transform:translate(-50%,-50%) scale(1); opacity:0.6;}
  50%{transform:translate(-50%,-50%) scale(1.3); opacity:1;}
}
.badge-ring {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:300px; height:300px; border-radius:50%;
  border:3px solid rgba(212,168,67,0.5);
  animation: ringPulse 1.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes ringPulse {
  0%,100%{transform:translate(-50%,-50%) scale(1); opacity:0.3;}
  50%{transform:translate(-50%,-50%) scale(1.15); opacity:0.8;}
}

/* ===== Fragment Fly-in for Badge ===== */
.frag-fly {
  position:fixed; font-size:50px; z-index:1001; pointer-events:none;
  transition: all 1s cubic-bezier(0.25,0.46,0.45,0.94);
}
</style>
</head>
<body>

<!-- ===== Welcome Page ===== -->
<div id="page-welcome" class="page active">
  <div class="welcome-bg"><div class="circle1"></div><div class="circle2"></div></div>
  <div class="welcome-inner">
    <div class="welcome-animals">🐸 🐷 🐦 🦁</div>
    <div class="title-card">
      <div class="decor-line"><span>🏯</span><span>🌺</span><span>🎤</span></div>
      <div class="title-main">齐齐望过去</div>
      <div class="title-sub">粤语童谣 · 岭南小歌星挑战</div>
    </div>
    <div class="step-preview" id="stepDots">
      <div class="step-dot">📖</div><div class="step-dot">🎵</div><div class="step-dot">🎧</div><div class="step-dot">🌟</div>
    </div>
    <button class="btn-start" onclick="startChallenge()">开 始 挑 战</button>
    <a href="vr.html" style="margin-top:14px;color:var(--blue);font-size:14px;text-decoration:underline;">🌐 进入VR探索场景</a>
  </div>
</div>

<!-- ===== Step 1: 念一念 ===== -->
<div id="page-read" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator">📖 第一关 · 读一读</span>
    <div class="fragments-mini" id="fragMini1"></div>
  </div>
  <div class="vocab-card" id="vocabCard">
    <video class="vocab-img" id="vocabVideo" style="display:none;" playsinline loop muted></video>
    <img class="vocab-img" id="vocabImg" src="" alt="" loading="lazy">
    <div class="vocab-word" id="vocabWord"></div>
    <div class="vocab-counter" id="vocabCounter"></div>
  </div>
  <div class="vocab-nav">
    <button id="btnPrevVocab" onclick="prevVocab()">◀</button>
    <button id="btnNextVocab" onclick="nextVocab()">▶</button>
  </div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord1" onclick="toggleRecord1()">🎤</button>
    <div class="record-hint" id="recordHint1">点按开始录音跟读</div>
    <div class="record-timer" id="recordTimer1"></div>
    <div id="playback1" style="margin-top:6px;"></div>
  </div>
  <button class="btn-action btn-gold" id="btnDoneRead" onclick="finishStep1()" style="display:none;">完成读一读，领取碎片 ✓</button>
</div>

<!-- ===== Step 2: 跟唱歌词 ===== -->
<div id="page-sing" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator">🎵 第二关 · 跟唱歌曲</span>
    <div class="fragments-mini" id="fragMini2"></div>
  </div>
  <div class="lyric-mini" id="lyricDots"></div>
  <div class="animal-display" id="animalDisplay2">
    <img id="animalImg2" src="" alt="">
    <div class="animal-label" id="animalLabel2"></div>
  </div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord2" onclick="toggleRecord2()">🎤</button>
    <div class="record-hint" id="recordHint2">播放歌曲后，点按录音跟唱</div>
    <div class="record-timer" id="recordTimer2"></div>
    <div id="playback2" style="margin-top:6px;"></div>
  </div>
  <button class="btn-action btn-primary" id="btnPlay2" onclick="togglePlay2()">▶ 播放歌曲</button>
  <button class="btn-action btn-gold" id="btnDoneSing" onclick="finishStep2()" style="display:none;">完成跟唱，领取碎片 ✓</button>
</div>

<!-- ===== Step 3: 接唱 ===== -->
<div id="page-echo" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator" id="echoTitle">🎧 第三关 · 接唱后半句</span>
    <div class="fragments-mini" id="fragMini3"></div>
  </div>
  <div class="animal-display" id="animalDisplay3">
    <img id="animalImg3" src="" alt="">
    <div class="animal-label" id="animalLabel3">听前半句，接唱后半句</div>
  </div>
  <p style="font-size:14px;color:#888;text-align:center;margin-bottom:4px;" id="echoHint">🎧 仔细听，音乐停了就轮到你唱！</p>
  <p style="font-size:13px;color:#888;text-align:center;margin-bottom:8px;">选择难度：</p>
  <div class="mode-choose" id="diffChooser3">
    <div class="mode-btn selected" onclick="selectDifficulty(1)">⭐<br>难度一</div>
    <div class="mode-btn" onclick="selectDifficulty(2)">⭐⭐<br>难度二</div>
  </div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord3" onclick="toggleRecord3()">🎤</button>
    <div class="record-hint" id="recordHint3">播放后自动开始录音</div>
    <div class="record-timer" id="recordTimer3"></div>
    <div id="playback3" style="margin-top:6px;"></div>
  </div>
  <button class="btn-action btn-primary" id="btnPlay3" onclick="togglePlay3()">▶ 播放接唱音乐</button>
  <button class="btn-action btn-gold" id="btnDoneEcho" onclick="finishStep3()" style="display:none;">完成接唱，领取碎片 ✓</button>
</div>

<!-- ===== Step 4: 唱整首 ===== -->
<div id="page-full" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator">🌟 第四关 · 完整演唱</span>
    <div class="fragments-mini" id="fragMini4"></div>
  </div>
  <div class="animal-display" id="animalDisplay4">
    <img id="animalImg4" src="images/phone/青蛙.jpg" alt="" style="width:100%;height:100%;object-fit:cover;">
    <div class="animal-label" id="animalLabel4">🎤 完整演唱《齐齐望过去》</div>
  </div>
  <p style="font-size:13px;color:#888;text-align:center;margin-bottom:4px;">选择难度：</p>
  <div class="mode-choose" id="diffChooser4">
    <div class="mode-btn selected" onclick="selectDifficulty(1)">⭐<br>难度一</div>
    <div class="mode-btn" onclick="selectDifficulty(2)">⭐⭐<br>难度二</div>
  </div>
  <div class="lyric-mini" id="lyricDots4"></div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord4" onclick="toggleRecord4()">🎤</button>
    <div class="record-hint" id="recordHint4">点按录音，完整演唱</div>
    <div class="record-timer" id="recordTimer4"></div>
    <div id="playback4" style="margin-top:6px;"></div>
  </div>
  <button class="btn-action btn-primary" id="btnPlay4" onclick="togglePlay4()">▶ 播放音乐</button>
  <button class="btn-action btn-gold" id="btnDoneFull" onclick="finishStep4()" style="display:none;">完成演唱，领取碎片 ✓</button>
</div>

<!-- ===== Fragment Popup Overlay ===== -->
<div id="fragmentPopup" class="fragment-popup" style="display:none;"></div>
<div id="fragmentFlyContainer" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1001;"></div>

<!-- ===== Badge Page ===== -->
<div id="page-badge" class="page">
  <div class="badge-bg"></div>
  <div class="badge-inner">
    <div style="position:relative;display:inline-block;">
      <div class="badge-glow"></div>
      <div class="badge-ring"></div>
      <img class="badge-img" src="images/badge.jpg" alt="岭南小歌星徽章" id="badgeFinal" style="position:relative;z-index:1;">
    </div>
    <div class="badge-name">🎖 岭南小歌星 🎖</div>
    <div class="badge-desc">恭喜你完成了《齐齐望过去》所有挑战！</div>
    <button class="btn-action btn-gold" onclick="restartAll()" style="font-size:18px;padding:14px 40px;">再玩一次</button>
    <button class="btn-action btn-outline" onclick="saveBadge()" style="margin-top:8px;">保存徽章图片</button>
  </div>
  <div class="confetti-wrap" id="confettiWrap"></div>
</div>

<script>
// ===== DATA =====
const vocabList = [
  { word:'望过去', src:'images/vocab-new/1.望过去.mp4', type:'video' },
  { word:'清溪',   src:'images/vocab-new/2.清溪.mp4', type:'video' },
  { word:'青蛙',   src:'images/vocab-new/3.青蛙.png', type:'image' },
  { word:'小屋',   src:'images/vocab-new/4.小屋.png', type:'image' },
  { word:'猪仔',   src:'images/vocab-new/5.猪仔.png', type:'image' },
  { word:'鹩哥',   src:'images/vocab-new/6.鹩哥.png', type:'image' },
  { word:'驳嘴',   src:'images/vocab-new/7.驳嘴.mp4', type:'video' },
  { word:'山隆',   src:'images/vocab-new/8.山隆.png', type:'image' },
  { word:'狮子',   src:'images/vocab-new/9.狮子.png', type:'image' },
];

// Difficulty audio mapping for steps 3 & 4
const diffAudio = {
  echo: {
    1: { back:'audio/difficulty/《齐齐望过去》难度1第三关接唱后半句.mp3', front:'audio/difficulty/《齐齐望过去》难度1第三关接唱前半句.mp3' },
    2: { back:'audio/difficulty/齐齐望过去（难度2第三关接唱后半句.mp3', front:'audio/difficulty/齐齐望过去（难度2第三关接唱前半句.mp3' }
  },
  full: {
    1: 'audio/difficulty/《齐齐望过去》难度1第四关难度2.mp3',
    2: 'audio/difficulty/齐齐望过去（难度2第四关难度3.mp3'
  }
};

const lyricLines = [
  { text:'齐齐望过去，清溪里有只青蛙想跳水', animal:'青蛙', img:'images/phone/青蛙.jpg' },
  { text:'齐齐望过去，小屋里有只猪仔真风趣', animal:'猪仔', img:'images/phone/猪仔.jpg' },
  { text:'有只鹩哥，吱吱喳喳想驳嘴',          animal:'鹩哥', img:'images/phone/鹩哥.jpg' },
  { text:'齐齐望过去，山窿里有只狮子竟饮醉', animal:'狮子', img:'images/phone/狮子.jpg' },
];

// Lyric timestamps in full song (seconds) - matched to actual audio
const lyricTimes = [8, 14, 21, 27];

// ===== STATE =====
let fragments = [false, false, false, false]; // 4 step fragments
let currentVocab = 0;
let vocabRecorded = new Array(9).fill(false);
let echoRound = 0; // 0 = sing back half, 1 = sing front half
let fullSongMode = 'original'; // 'original' | 'accompany'
let difficulty = 1; // 1 or 2 for steps 3 & 4

// Audio & Recording
let currentAudio = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordingForStep = null; // 'read','sing','echo','full'
let recordTimerInterval = null;
let recordSeconds = 0;
let lastRecordingURL = null; // For playback after recording

// Sound effects
const sfx = { ding: null, fanfare: null };
function initSFX() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Ding sound for fragments
    sfx.ding = () => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.5);
    };
    // Fanfare for badge
    sfx.fanfare = () => {
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.value = freq;
        const t = ctx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.25, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        o.start(t);
        o.stop(t + 0.4);
      });
    };
  } catch(e) {}
}

function showBadgeAssembly() {
  initSFX();
  if (sfx.fanfare) sfx.fanfare();
  const fragImgs = ['images/fragments/frag1.png','images/fragments/frag2.png','images/fragments/frag3.png','images/fragments/frag4.png'];
  const container = document.getElementById('fragmentFlyContainer');
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  container.innerHTML = '';

  // Darken background for dramatic effect
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;transition:opacity 0.5s;';
  container.appendChild(overlay);

  const starts = [
    {x: -100, y: -100},
    {x: window.innerWidth + 100, y: -100},
    {x: -100, y: window.innerHeight + 100},
    {x: window.innerWidth + 100, y: window.innerHeight + 100},
  ];

  // Target positions: 4 quadrants around center
  const targets = [
    {x: cx - 55, y: cy - 55},
    {x: cx + 5, y: cy - 55},
    {x: cx - 55, y: cy + 5},
    {x: cx + 5, y: cy + 5},
  ];

  // Phase 1: Fragments fly in from corners
  fragImgs.forEach((src, i) => {
    const el = document.createElement('img');
    el.src = src;
    el.style.cssText = 'position:fixed;width:100px;height:100px;object-fit:contain;z-index:1001;transition:all 1s cubic-bezier(0.25,0.46,0.45,0.94);';
    el.style.left = starts[i].x + 'px';
    el.style.top = starts[i].y + 'px';
    el.style.opacity = '0.5';
    el.style.transform = 'rotate(180deg) scale(0.5)';
    container.appendChild(el);

    requestAnimationFrame(() => {
      el.style.left = targets[i].x + 'px';
      el.style.top = targets[i].y + 'px';
      el.style.opacity = '1';
      el.style.transform = 'rotate(0deg) scale(1)';
    });
  });

  // Phase 2: Fragments merge into center (after 1.2s)
  setTimeout(() => {
    const frags = container.querySelectorAll('img');
    frags.forEach(el => {
      el.style.transition = 'all 0.8s cubic-bezier(0.6,0.04,0.98,0.335)';
      el.style.left = (cx - 50) + 'px';
      el.style.top = (cy - 50) + 'px';
      el.style.opacity = '0';
      el.style.transform = 'scale(0.1)';
    });

    // Show glowing badge at center during merge
    const glow = document.createElement('div');
    glow.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(212,168,67,0.8) 0%,rgba(255,215,0,0.4) 40%,transparent 70%);z-index:1002;transition:transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275);';
    container.appendChild(glow);
    requestAnimationFrame(() => { glow.style.transform = 'translate(-50%,-50%) scale(1.5)'; });
  }, 1200);

  // Phase 3: Clean up and show badge page
  setTimeout(() => {
    overlay.style.opacity = '0';
    container.innerHTML = '';
  }, 2000);
}

function stopAllAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
}

function stopAllRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  mediaRecorder = null;
  recordedChunks = [];
  if (recordTimerInterval) { clearInterval(recordTimerInterval); recordTimerInterval = null; }
  recordSeconds = 0;
  clearAllTimerDisplays();
}
function clearAllTimerDisplays() {
  for (const s of ['1','2','3','4']) {
    const el = document.getElementById('recordTimer' + s);
    if (el) el.textContent = '';
  }
}

function startRecording(stepName) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('你的浏览器不支持录音功能，请使用 Chrome 或 Safari 打开。');
    return false;
  }
  stopAllRecording();
  clearPlayback({read:'1',sing:'2',echo:'3',full:'4'}[stepName]||'1');
  recordedChunks = [];
  recordSeconds = 0;
  recordingForStep = stepName;

  // Find supported MIME type
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/wav'];
  let mimeType = 'audio/webm';
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    try {
      mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
    } catch(e) {
      mediaRecorder = new MediaRecorder(stream);
    }
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (recordTimerInterval) { clearInterval(recordTimerInterval); recordTimerInterval = null; }
    };
    mediaRecorder.onerror = (e) => {
      console.error('MediaRecorder error:', e);
      alert('录音出错，请重试。');
    };
    mediaRecorder.start(1000); // Collect data every second
    recordTimerInterval = setInterval(() => {
      recordSeconds++;
      updateRecordTimerDisplay();
    }, 1000);
    updateRecordUI(true);
  }).catch(err => {
    console.error('Mic error:', err);
    let msg = '无法访问麦克风。';
    if (err.name === 'NotAllowedError') msg = '麦克风权限被拒绝，请在浏览器设置中允许麦克风访问。';
    else if (err.name === 'NotFoundError') msg = '未检测到麦克风设备。';
    alert(msg);
  });
  return true;
}

function stopRecordingAndSave() {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') {
    return Promise.resolve(null);
  }
  return new Promise(resolve => {
    const mr = mediaRecorder;
    mr.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      if (recordTimerInterval) { clearInterval(recordTimerInterval); recordTimerInterval = null; }
      clearAllTimerDisplays();
      lastRecordingURL = url;
      showPlaybackButton(url);
      resolve({ blob, url });
    };
    mr.stop();
  });
}

function showPlaybackButton(url) {
  const step = {read:'1',sing:'2',echo:'3',full:'4'}[recordingForStep] || '1';
  const container = document.getElementById('playback' + step);
  if (!container) return;
  container.innerHTML = '<audio controls src="' + url + '" style="width:100%;max-width:300px;height:36px;margin-top:4px;"></audio><br><small style="color:#888;">点击播放聆听你的录音</small>';
}

function clearPlayback(step) {
  const container = document.getElementById('playback' + step);
  if (container) container.innerHTML = '';
}

function updateRecordUI(isRec) {
  const step = {read:'1',sing:'2',echo:'3',full:'4'}[recordingForStep] || '1';
  const btnId = 'btnRecord' + step;
  const hintId = 'recordHint' + step;
  const timerId = 'recordTimer' + step;
  const btn = document.getElementById(btnId);
  const hint = document.getElementById(hintId);
  const timer = document.getElementById(timerId);
  if (btn) { btn.classList.toggle('recording', isRec); btn.textContent = isRec ? '⏹' : '🎤'; }
  if (hint) { hint.textContent = isRec ? '正在录音中...' : '点按开始录音'; }
  if (!isRec && timer) { timer.textContent = ''; }
}

function updateRecordTimerDisplay() {
  const timerId = 'recordTimer' + ({read:'1',sing:'2',echo:'3',full:'4'}[recordingForStep]||'1');
  const el = document.getElementById(timerId);
  if (el) {
    const m = Math.floor(recordSeconds / 60);
    const s = recordSeconds % 60;
    el.textContent = '⏱ ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
}

  // Show cover image before vocab starts
  document.getElementById('vocabImg').src = 'images/cover/step1.png';
  document.getElementById('vocabWord').textContent = '📖 第一关 · 读一读';
  document.getElementById('vocabCounter').textContent = '跟读重点词汇';
  updateAllFragments();
  document.getElementById('btnDoneRead').style.display = 'none';
}

function updateVocabUI() {
  const v = vocabList[currentVocab];
  const img = document.getElementById('vocabImg');
  const video = document.getElementById('vocabVideo');
  if (v.type === 'video') {
    img.style.display = 'none';
    video.style.display = 'block';
    video.src = v.src;
    video.play().catch(() => {});
  } else {
    video.style.display = 'none';
    video.pause();
    img.style.display = 'block';
    img.src = v.src;
  }
  document.getElementById('vocabWord').textContent = v.word;
  document.getElementById('vocabCounter').textContent = (currentVocab + 1) + ' / ' + vocabList.length;
  document.getElementById('btnPrevVocab').disabled = (currentVocab === 0);
  document.getElementById('btnNextVocab').disabled = (currentVocab === vocabList.length - 1);
  document.getElementById('recordHint1').textContent = vocabRecorded[currentVocab] ? '✓ 已录音' : '点按开始录音跟读';
  // Show done button if all recorded
  if (vocabRecorded.every(x => x)) {
    document.getElementById('btnDoneRead').style.display = 'inline-block';
  }
}

function prevVocab() { if (currentVocab > 0) { currentVocab--; updateVocabUI(); } }
function nextVocab() { if (currentVocab < vocabList.length - 1) { currentVocab++; updateVocabUI(); } }

function toggleRecord1() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecordingAndSave().then(result => {
      if (result) {
        vocabRecorded[currentVocab] = true;
        updateVocabUI();
      }
      updateRecordUI(false);
      recordingForStep = null;
    });
  } else {
    // Switch from cover to first vocab word when recording starts
    updateVocabUI();
    startRecording('read');
  }
}

function finishStep1() {
  stopAllRecording();
  updateRecordUI(false);
  recordingForStep = null;
  fragments[0] = true;
  updateAllFragments();
  showFragmentPopup(0);
  setTimeout(() => showStep2(), 800);
}

function togglePlay2() {
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    document.getElementById('btnPlay2').textContent = '▶ 继续播放';
    return;
  }
  if (currentAudio && currentAudio.paused) {
    currentAudio.play();
    document.getElementById('btnPlay2').textContent = '⏸ 暂停';
    return;
  }
  stopAllAudio();
  currentAudio = new Audio('audio/full.mp3');
  let lastIdx = -1;
  // Show cover first
  document.getElementById('animalImg2').src = 'images/cover/step2.png';
  document.getElementById('animalLabel2').textContent = '🎵 第二关 · 跟唱歌曲';
  document.querySelectorAll('.lyric-dot').forEach(d => d.classList.remove('active'));
  currentAudio.ontimeupdate = () => {
    const t = currentAudio.currentTime;
    if (t < lyricTimes[0]) {
      if (lastIdx !== -1) { lastIdx = -1; document.getElementById('animalImg2').src = 'images/cover/step2.png'; document.getElementById('animalLabel2').textContent = '🎵 第二关 · 跟唱歌曲'; document.querySelectorAll('.lyric-dot').forEach(d => d.classList.remove('active')); }
      return;
    }
    let idx = 0;
    for (let i = lyricTimes.length - 1; i >= 0; i--) {
      if (t >= lyricTimes[i]) { idx = i; break; }
    }
    if (idx !== lastIdx) { lastIdx = idx; updateAnimalDisplay2(idx); }
  };
  currentAudio.onended = () => {
    updateAnimalDisplay2(3);
    document.getElementById('btnPlay2').textContent = '▶ 重新播放';
    currentAudio = null;
    document.getElementById('btnDoneSing').style.display = 'inline-block';
  };
  currentAudio.play();
  document.getElementById('btnPlay2').textContent = '⏸ 暂停';
}

function toggleRecord2() {

      recordingForStep = null;
      document.getElementById('btnDoneSing').style.display = 'inline-block';

    startRecording('sing');

function selectDifficulty(diff) {
  difficulty = diff;
  // Stop current audio immediately so next play uses new difficulty
  stopAllAudio();
  const onPage = document.querySelector('.page.active');
  if (onPage) {
    const pid = onPage.id;
    if (pid === 'page-echo') { document.getElementById('btnPlay3').textContent = '▶ 播放接唱音乐'; }
    if (pid === 'page-full') { document.getElementById('btnPlay4').textContent = '▶ 播放音乐'; }
  }
  // Update step 3 chooser if visible
  const c3 = document.getElementById('diffChooser3');
  if (c3) c3.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('selected', i+1 === diff));
  // Update step 4 chooser if visible
  const c4 = document.getElementById('diffChooser4');
  if (c4) c4.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('selected', i+1 === diff));
}

function selectMode(mode) {
  fullSongMode = mode;
  document.getElementById('modeOriginal').classList.toggle('selected', mode === 'original');
  document.getElementById('modeAccompany').classList.toggle('selected', mode === 'accompany');
  stopAllAudio();
  document.getElementById('btnPlay4').textContent = '▶ 播放音乐';
}

function togglePlay4() {
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    document.getElementById('btnPlay4').textContent = '▶ 继续播放';
    return;
  }
  if (currentAudio && currentAudio.paused) {
    currentAudio.play();
    document.getElementById('btnPlay4').textContent = '⏸ 暂停';
    return;
  }
  stopAllAudio();
  const audioFile = diffAudio.full[difficulty];
  currentAudio = new Audio(audioFile);
  let lastIdx = -1;
  // Show cover first
  document.getElementById('animalImg4').src = 'images/cover/step4.png';
  document.getElementById('animalLabel4').textContent = '🌟 第四关 · 完整演唱';
  document.querySelectorAll('#lyricDots4 .lyric-dot').forEach(d => d.classList.remove('active'));
  currentAudio.ontimeupdate = () => {
    const t = currentAudio.currentTime;
    if (t < lyricTimes[0]) {
      if (lastIdx !== -1) { lastIdx = -1; document.getElementById('animalImg4').src = 'images/cover/step4.png'; document.getElementById('animalLabel4').textContent = '🌟 第四关 · 完整演唱'; document.querySelectorAll('#lyricDots4 .lyric-dot').forEach(d => d.classList.remove('active')); }
      return;
    }
    let idx = 0;
    for (let i = lyricTimes.length - 1; i >= 0; i--) {
      if (t >= lyricTimes[i]) { idx = i; break; }
    }
    if (idx !== lastIdx) {
      lastIdx = idx;
      const l = lyricLines[idx];
      document.getElementById('animalImg4').src = l.img;
      document.getElementById('animalLabel4').textContent = '🎤 ' + l.text;
      document.querySelectorAll('#lyricDots4 .lyric-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
    }
  };
  currentAudio.onended = () => {
    document.getElementById('btnPlay4').textContent = '▶ 重新播放';
    currentAudio = null;
    document.getElementById('btnDoneFull').style.display = 'inline-block';
  };
  // Show first animal immediately
  document.getElementById('animalImg4').src = lyricLines[0].img;
  document.getElementById('animalLabel4').textContent = '🎤 ' + lyricLines[0].text;
  currentAudio.play();
  document.getElementById('btnPlay4').textContent = '⏸ 暂停';
}

function toggleRecord4() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecordingAndSave().then(() => {
      updateRecordUI(false);
      recordingForStep = null;
      document.getElementById('btnDoneFull').style.display = 'inline-block';
    });
  } else {
    startRecording('full');
  }
}

function finishStep4() {
  stopAllAudio();
  stopAllRecording();
  updateRecordUI(false);
  recordingForStep = null;
  fragments[3] = true;
  updateAllFragments();
  showFragmentPopup(3);
  setTimeout(() => {
    showBadgeAssembly();
    setTimeout(() => showBadge(), 2200);
  }, 800);
}

// ===== BADGE =====
function showBadge() {
  showPage('page-badge');
  updateAllFragments();
  spawnConfetti();
}

function spawnConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#C41E3A','#D4A843','#5B8C5A','#FFAB91','#5B9BD5','#F4A460','#E63946','#FFD700'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = -(Math.random() * 40) + 'px';
    el.style.width = (6 + Math.random() * 10) + 'px';
    el.style.height = (6 + Math.random() * 14) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 5000);
}

function saveBadge() {
  const link = document.createElement('a');
  link.download = '岭南小歌星徽章.png';
  link.href = document.getElementById('badgeFinal').src;
  link.click();
}

function restartAll() {
  fragments = [false,false,false,false];
  vocabRecorded = new Array(9).fill(false);
  echoRound = 0;
  stopAllAudio();
  stopAllRecording();
  for (let s = 1; s <= 4; s++) clearPlayback(s);
  showPage('page-welcome');
  updateAllFragments();
}

// ===== INIT =====
updateAllFragments();
</script>
</body>
</html>
