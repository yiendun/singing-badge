<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>岭南歌唱达人</title>
<style>
  :root {
    --red: #C41E3A;
    --gold: #D4A843;
    --green: #5B8C5A;
    --cream: #FFF8EC;
    --dark: #3D2C2C;
    --pink: #FFAB91;
    --blue: #5B9BD5;
    --orange: #F4A460;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'PingFang SC','Microsoft YaHei','Noto Sans HK',sans-serif;
    background: linear-gradient(180deg, #FFF8EC 0%, #FFE8D6 50%, #FFD4B8 100%);
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .page {
    display: none; flex-direction: column; align-items: center;
    min-height: 100vh; min-height: 100dvh;
    padding: 20px 16px;
  }
  .page.active { display: flex; }

  /* ===== Welcome Page ===== */
  .welcome-top { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .lingnan-decor {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 16px;
  }
  .decor-icon { font-size: 36px; animation: float 3s ease-in-out infinite; }
  .decor-icon:nth-child(2) { animation-delay: 0.5s; }
  .decor-icon:nth-child(3) { animation-delay: 1s; }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .wok-ear-svg { width: 200px; height: 60px; margin-bottom: 8px; }
  .title-main {
    font-size: 32px; font-weight: 900; color: var(--red);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    letter-spacing: 4px;
  }
  .title-sub {
    font-size: 15px; color: var(--dark); margin-top: 6px;
    background: var(--gold); color: #fff; padding: 4px 16px;
    border-radius: 20px; font-weight: 600;
  }
  .mascot-area { margin: 12px 0; position: relative; }
  .mascot-circle {
    width: 140px; height: 140px; border-radius: 50%;
    background: linear-gradient(135deg, #FFD4B8, #FFAB91);
    display: flex; align-items: center; justify-content: center;
    font-size: 72px; box-shadow: 0 6px 24px rgba(196,30,58,0.25);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 6px 24px rgba(196,30,58,0.25); }
    50% { transform: scale(1.05); box-shadow: 0 8px 32px rgba(196,30,58,0.4); }
  }
  .btn-start {
    background: linear-gradient(135deg, #C41E3A, #E63946);
    color: #fff; border: none; padding: 16px 56px;
    font-size: 22px; font-weight: 700; border-radius: 50px;
    letter-spacing: 3px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(196,30,58,0.4);
    transition: transform 0.15s;
  }
  .btn-start:active { transform: scale(0.95); }

  /* ===== Sing Page ===== */
  .sing-header {
    width: 100%; display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .btn-back {
    background: #fff; border: 2px solid #ddd; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .progress-bar-wrap {
    flex:1; height: 10px; background: #eee; border-radius: 5px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--red); border-radius: 5px;
    transition: width 0.5s ease; width: 0%;
  }
  .progress-text { font-size: 13px; color: #888; font-weight: 600; }

  .lyric-card {
    width: 100%; background: #fff; border-radius: 20px;
    padding: 28px 20px; text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .lyric-current {
    font-size: 24px; font-weight: 700; color: var(--dark);
    line-height: 1.8; transition: all 0.3s;
  }
  .lyric-animal { font-size: 40px; margin-top: 8px; display: block; }

  .fragments-row {
    display: flex; gap: 12px; margin-bottom: 20px; width: 100%;
    justify-content: center;
  }
  .fragment-slot {
    width: 64px; height: 64px; border-radius: 16px;
    border: 3px dashed #ddd;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 28px;
    transition: all 0.4s ease;
    background: #f9f9f9;
    position: relative;
  }
  .fragment-slot.unlocked {
    border: 3px solid var(--gold);
    background: #fff;
    animation: unlockPop 0.5s ease;
    box-shadow: 0 0 16px rgba(212,168,67,0.4);
  }
  @keyframes unlockPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }
  .fragment-check {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--green); color: #fff;
    font-size: 12px; display: flex;
    align-items: center; justify-content: center;
    transform: scale(0); transition: transform 0.3s 0.3s;
  }
  .fragment-slot.unlocked .fragment-check { transform: scale(1); }

  .sing-controls { width: 100%; text-align: center; }
  .btn-record {
    width: 90px; height: 90px; border-radius: 50%;
    border: none; background: linear-gradient(135deg, #C41E3A, #E63946);
    color: #fff; font-size: 36px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(196,30,58,0.35);
    transition: all 0.2s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-record:active { transform: scale(0.9); }
  .btn-record.recording {
    animation: recordPulse 0.8s ease-in-out infinite;
    background: linear-gradient(135deg, #ff1744, #ff5252);
    box-shadow: 0 0 0 0 rgba(255,23,68,0.6);
  }
  @keyframes recordPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,23,68,0.6); }
    100% { box-shadow: 0 0 0 24px rgba(255,23,68,0); }
  }
  .record-hint { font-size: 14px; color: #888; margin-top: 10px; }
  .recognition-text {
    margin-top: 8px; font-size: 14px; color: #999;
    font-style: italic; min-height: 20px;
  }
  .mode-toggle {
    margin-top: 12px; font-size: 13px; color: var(--blue);
    background: none; border: none; text-decoration: underline; cursor: pointer;
  }
  .btn-skip {
    display: none;
    margin-top: 12px; background: var(--gold); color: #fff;
    border: none; padding: 10px 28px; border-radius: 25px;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn-skip.show { display: inline-block; }

  /* ===== Badge Page ===== */
  .badge-container { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .badge-canvas-wrap {
    position: relative; margin-bottom: 8px;
  }
  #badgeCanvas { width: 300px; height: 300px; }
  .badge-title {
    font-size: 28px; font-weight: 900; color: var(--red);
    letter-spacing: 3px; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
  }
  .badge-subtitle { font-size: 15px; color: #888; margin: 6px 0 16px; }
  .btn-restart {
    background: var(--gold); color: #fff; border: none;
    padding: 12px 36px; font-size: 18px; font-weight: 700;
    border-radius: 50px; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 4px 16px rgba(212,168,67,0.4);
  }
  .btn-save {
    background: #fff; color: var(--red); border: 2px solid var(--red);
    padding: 10px 28px; font-size: 15px; font-weight: 600;
    border-radius: 50px; cursor: pointer; margin-top: 10px;
  }
  .confetti-wrap {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events: none; z-index: 999; overflow: hidden;
  }
  .confetti {
    position: absolute; width: 10px; height: 10px;
    border-radius: 2px; animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-100px) rotate(0deg); opacity:1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity:0; }
  }
  .qr-section { margin-top: 12px; text-align: center; }
  .qr-section img { width: 100px; height: 100px; border-radius: 8px; }
  .qr-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>

<!-- Welcome Page -->
<div id="page-welcome" class="page active">
  <div class="welcome-top">
    <div class="lingnan-decor">
      <span class="decor-icon">🌺</span>
      <span class="decor-icon">🦁</span>
      <span class="decor-icon">🏯</span>
    </div>
    <svg class="wok-ear-svg" viewBox="0 0 200 60">
      <path d="M10,50 Q25,10 40,50 Q55,10 70,50 Q85,10 100,50 Q115,10 130,50 Q145,10 160,50 Q175,10 190,50"
            fill="none" stroke="#C41E3A" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="title-main">齐齐望过去</div>
    <div class="title-sub">粤语童谣 · 歌唱挑战</div>
    <div class="mascot-area">
      <div class="mascot-circle">🎤</div>
    </div>
    <div style="font-size:13px;color:#999;margin-bottom:20px;">
      集齐碎片，成为岭南歌唱达人！
    </div>
    <button class="btn-start" onclick="startSinging()">开 始 唱 歌</button>
  </div>
  <div class="qr-section" id="qrSection" style="display:none;">
    <p style="font-size:12px;color:#aaa;">扫码分享给朋友：</p>
    <img id="qrImg" src="" alt="QR Code" style="width:80px;height:80px;"/>
  </div>
</div>

<!-- Sing Page -->
<div id="page-sing" class="page">
  <div class="sing-header">
    <button class="btn-back" onclick="goBack()">←</button>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <span class="progress-text" id="progressText">0/4</span>
  </div>
  <div class="lyric-card" id="lyricCard">
    <div class="lyric-current" id="lyricText"></div>
    <span class="lyric-animal" id="lyricAnimal"></span>
  </div>
  <div class="fragments-row" id="fragmentsRow"></div>
  <div class="sing-controls">
    <button class="btn-record" id="btnRecord" onclick="toggleRecording()">🎤</button>
    <div class="record-hint" id="recordHint">点按唱歌</div>
    <div class="recognition-text" id="recogText"></div>
    <button class="btn-skip" id="btnSkip" onclick="skipLine()">我唱完啦～</button>
    <button class="mode-toggle" id="btnModeToggle" onclick="toggleMode()">切换跟唱模式</button>
  </div>
</div>

<!-- Badge Page -->
<div id="page-badge" class="page">
  <div class="badge-container">
    <div class="badge-canvas-wrap">
      <canvas id="badgeCanvas" width="400" height="400"></canvas>
    </div>
    <div class="badge-title">🎖 岭南歌唱达人 🎖</div>
    <div class="badge-subtitle">恭喜你学会了《齐齐望过去》！</div>
    <button class="btn-restart" onclick="restart()">再唱一次</button>
    <button class="btn-save" onclick="saveBadge()">保存徽章</button>
  </div>
  <div class="confetti-wrap" id="confettiWrap"></div>
</div>

<script>
// ===== State =====
let currentLine = 0;
let fragments = [false, false, false, false];
let isRecording = false;
let recognition = null;
let voiceMode = true; // true=voice, false=manual tap
let retryCount = 0;

const lyrics = [
  { text: '齐齐望过去，清溪里有只青蛙想跳水', animal: '🐸', name: '青蛙',
    keywords: ['齐齐望过去','清溪','青蛙','跳水'] },
  { text: '齐齐望过去，小屋里有只猪仔真风趣', animal: '🐷', name: '猪仔',
    keywords: ['齐齐望过去','小屋','猪仔','风趣'] },
  { text: '有只鹩哥，吱吱喳喳想驳嘴', animal: '🐦', name: '鹩哥',
    keywords: ['鹩哥','吱吱喳喳','驳嘴'] },
  { text: '齐齐望过去，山窿里有只狮子竟饮醉', animal: '🦁', name: '狮子',
    keywords: ['齐齐望过去','山窿','狮子','饮醉'] },
];

// Page transition helpers
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== Welcome Page =====
function startSinging() {
  currentLine = 0;
  fragments = [false, false, false, false];
  retryCount = 0;
  stopRecording();
  recognition = null;
  updateSingUI();
  showPage('page-sing');
  if (voiceMode) initSpeechRecognition();
}

function goBack() {
  stopRecording();
  showPage('page-welcome');
}

// ===== Sing Page UI =====
function updateSingUI() {
  document.getElementById('progressBar').style.width = (currentLine / 4 * 100) + '%';
  document.getElementById('progressText').textContent = currentLine + '/4';

  if (currentLine < 4) {
    const ly = lyrics[currentLine];
    document.getElementById('lyricText').textContent = ly.text;
    document.getElementById('lyricAnimal').textContent = ly.animal;
    document.getElementById('lyricCard').style.background = '#fff';
    document.getElementById('recogText').textContent = '';
    document.getElementById('recordHint').textContent = voiceMode ? '点按唱歌' : '点按下一句';
    document.getElementById('btnModeToggle').textContent = voiceMode ? '切换跟唱模式' : '切换语音模式';
    document.getElementById('btnSkip').classList.toggle('show', !voiceMode);
    document.getElementById('btnRecord').style.display = 'inline-flex';
  }
  updateFragments();
}

function updateFragments() {
  const row = document.getElementById('fragmentsRow');
  row.innerHTML = '';
  lyrics.forEach((ly, i) => {
    const div = document.createElement('div');
    div.className = 'fragment-slot' + (fragments[i] ? ' unlocked' : '');
    div.innerHTML = (fragments[i] ? ly.animal : '？') +
      '<span class="fragment-check">✓</span>';
    row.appendChild(div);
  });
}

// ===== Speech Recognition =====
function initSpeechRecognition() {
  if (recognition) {
    recognition.abort();
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    voiceMode = false;
    updateSingUI();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-HK';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;

  recognition.onresult = (event) => {
    let interimText = '';
    let finalTexts = [];
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        for (let j = 0; j < event.results[i].length; j++) {
          finalTexts.push(event.results[i][j].transcript);
        }
      } else {
        interimText += event.results[i][0].transcript;
      }
    }
    if (interimText) {
      document.getElementById('recogText').textContent = '听到：' + interimText;
    }
    if (finalTexts.length > 0) {
      document.getElementById('recogText').textContent = '听到：' + finalTexts[0];
      checkLyricMatch(finalTexts);
    }
  };

  recognition.onerror = (event) => {
    console.log('Speech error:', event.error);
    if (event.error === 'no-speech') {
      document.getElementById('recogText').textContent = '未检测到声音，再试一次吧～';
    } else if (event.error === 'network') {
      document.getElementById('recogText').textContent = '网络问题，切换跟唱模式试试？';
    } else {
      document.getElementById('recogText').textContent = '嗯？再试一次吧～';
    }
    stopRecording();
  };

  recognition.onend = () => {
    stopRecording();
  };
}

function toggleRecording() {
  if (currentLine >= 4) return;

  if (!voiceMode) {
    // Manual mode: just advance
    onLineComplete();
    return;
  }

  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  if (!recognition) { initSpeechRecognition(); }
  if (!recognition) {
    voiceMode = false; updateSingUI(); return;
  }
  try {
    recognition.start();
    isRecording = true;
    document.getElementById('btnRecord').classList.add('recording');
    document.getElementById('recordHint').textContent = '正在听...';
    document.getElementById('recogText').textContent = '';
    retryCount = 0;
  } catch(e) {
    console.log('Recognition start error:', e);
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
  }
  document.getElementById('btnRecord').classList.remove('recording');
  document.getElementById('recordHint').textContent = voiceMode ? '点按唱歌' : '点按下一句';
}

// ===== Lyrics Matching =====
function checkLyricMatch(spokenTexts) {
  if (currentLine >= 4) return;
  const target = lyrics[currentLine];

  // Try each alternative transcription
  let bestRatio = 0;
  for (const spoken of spokenTexts) {
    const spokenClean = spoken.replace(/[，。！？、；：""''「」\s]/g, '');
    let matchCount = 0;
    target.keywords.forEach(kw => {
      if (spokenClean.includes(kw)) matchCount++;
    });
    const ratio = matchCount / target.keywords.length;
    if (ratio > bestRatio) bestRatio = ratio;
  }

  if (bestRatio >= 0.5) {
    document.getElementById('lyricCard').style.background = '#E8F5E9';
    document.getElementById('recogText').textContent = '太棒了！✓';
    setTimeout(() => onLineComplete(), 600);
  } else {
    retryCount++;
    if (retryCount >= 3) {
      document.getElementById('recogText').textContent = '没关系，再试试～或者切换跟唱模式';
      document.getElementById('btnSkip').classList.add('show');
    } else {
      document.getElementById('recogText').textContent = '差一点点，再试一次吧～（' + retryCount + '/3）';
    }
  }
}

// ===== Line Completion =====
function playDing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

function onLineComplete() {
  stopRecording();
  playDing();
  fragments[currentLine] = true;
  updateFragments();
  currentLine++;
  retryCount = 0;
  document.getElementById('btnSkip').classList.remove('show');

  if (currentLine >= 4) {
    setTimeout(() => showBadge(), 800);
  } else {
    updateSingUI();
    if (voiceMode) initSpeechRecognition();
  }
}

function skipLine() {
  if (!isRecording && !voiceMode) {
    onLineComplete();
  } else {
    // Force pass
    stopRecording();
    onLineComplete();
  }
}

function toggleMode() {
  voiceMode = !voiceMode;
  stopRecording();
  retryCount = 0;
  document.getElementById('btnSkip').classList.remove('show');
  updateSingUI();
}

// ===== Badge Drawing =====
function drawBadge() {
  const canvas = document.getElementById('badgeCanvas');
  const ctx = canvas.getContext('2d');
  const w = 400, h = 400;
  const cx = w / 2, cy = h / 2;
  ctx.clearRect(0, 0, w, h);

  // --- Outer glow ---
  const glowGrad = ctx.createRadialGradient(cx, cy, 140, cx, cy, 200);
  glowGrad.addColorStop(0, 'rgba(212,168,67,0.3)');
  glowGrad.addColorStop(1, 'rgba(212,168,67,0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath(); ctx.arc(cx, cy, 200, 0, Math.PI*2); ctx.fill();

  // --- 镬耳墙 outer border ---
  drawWokEarRing(ctx, cx, cy, 170, 18);

  // --- Gold ring ---
  ctx.beginPath();
  ctx.arc(cx, cy, 155, 0, Math.PI * 2);
  ctx.fillStyle = '#D4A843';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 148, 0, Math.PI * 2);
  ctx.fillStyle = '#C4963A';
  ctx.fill();

  // --- Inner cream background ---
  const innerGrad = ctx.createRadialGradient(cx, cy-20, 10, cx, cy, 145);
  innerGrad.addColorStop(0, '#FFFFFF');
  innerGrad.addColorStop(1, '#FFF4E0');
  ctx.beginPath();
  ctx.arc(cx, cy, 145, 0, Math.PI * 2);
  ctx.fillStyle = innerGrad;
  ctx.fill();

  // --- Dot border (inner ring decoration) ---
  ctx.fillStyle = '#D4A843';
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const dx = cx + 142 * Math.cos(a);
    const dy = cy + 142 * Math.sin(a);
    ctx.beginPath(); ctx.arc(dx, dy, 3, 0, Math.PI * 2); ctx.fill();
  }

  // --- 木棉花 (Kapok) at top ---
  drawKapok(ctx, cx, cy - 95, 28);  // top
  drawKapok(ctx, cx - 105, cy + 10, 18); // left
  drawKapok(ctx, cx + 105, cy + 10, 18); // right

  // --- 舞狮 face (center) ---
  drawLionDance(ctx, cx, cy + 15, 90);

  // --- Arc text ---
  drawArcText(ctx, '嶺南歌唱達人', cx, cy + 15, 118, '#C41E3A', 'bold 22px "PingFang SC","Microsoft YaHei","Noto Sans HK",sans-serif');

  // --- Small stars ---
  ctx.fillStyle = '#FFD700';
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 130;
    const sx = cx + r * Math.cos(a);
    const sy = cy + r * Math.sin(a);
    drawStar(ctx, sx, sy, 3 + Math.random() * 3, 5);
  }

  // --- Below-badge text ---
  ctx.fillStyle = '#C41E3A';
  ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei","Noto Sans HK",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('齐齐望过去', cx, cy + 170);
  ctx.fillStyle = '#888';
  ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans HK",sans-serif';
  ctx.fillText('粤语童谣 · 完整演唱', cx, cy + 188);
}

function drawWokEarRing(ctx, cx, cy, r, count) {
  const archW = (2 * Math.PI) / count;
  ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const a0 = i * archW - Math.PI / 2;
    const a1 = a0 + archW;
    const am = (a0 + a1) / 2;
    const sx = cx + r * Math.cos(a0);
    const sy = cy + r * Math.sin(a0);
    const peakR = r + 14;
    const px = cx + peakR * Math.cos(am);
    const py = cy + peakR * Math.sin(am);
    const ex = cx + r * Math.cos(a1);
    const ey = cy + r * Math.sin(a1);
    const cpR = r - 4;
    const cp1x = cx + cpR * Math.cos(a0 + archW * 0.25);
    const cp1y = cy + cpR * Math.sin(a0 + archW * 0.25);
    const cp2x = cx + cpR * Math.cos(a1 - archW * 0.25);
    const cp2y = cy + cpR * Math.sin(a1 - archW * 0.25);

    if (i === 0) ctx.moveTo(sx, sy);
    ctx.bezierCurveTo(cp1x, cp1y, px, py, px, py);
    ctx.bezierCurveTo(px, py, cp2x, cp2y, ex, ey);
  }
  ctx.closePath();
  ctx.fillStyle = '#B71C1C';
  ctx.fill();
  ctx.strokeStyle = '#8B0000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Inner highlight on each arch
  ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const a0 = i * archW - Math.PI / 2;
    const a1 = a0 + archW;
    const am = (a0 + a1) / 2;
    const innerR = r + 3;
    const sx = cx + innerR * Math.cos(a0);
    const sy = cy + innerR * Math.sin(a0);
    const peakR = innerR + 8;
    const px = cx + peakR * Math.cos(am);
    const py = cy + peakR * Math.sin(am);
    const ex = cx + innerR * Math.cos(a1);
    const ey = cy + innerR * Math.sin(a1);
    if (i === 0) ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(px, py, ex, ey);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawKapok(ctx, cx, cy, size) {
  for (let i = 0; i < 5; i++) {
    const a = (i * 72 - 90) * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-size*0.35, -size*0.4, -size*0.3, -size*0.85, 0, -size);
    ctx.bezierCurveTo(size*0.3, -size*0.85, size*0.35, -size*0.4, 0, 0);
    const petalGrad = ctx.createLinearGradient(0, 0, 0, -size);
    petalGrad.addColorStop(0, '#FF5252');
    petalGrad.addColorStop(1, '#C41E3A');
    ctx.fillStyle = petalGrad;
    ctx.fill();
    ctx.restore();
  }
  // Stamens
  ctx.fillStyle = '#FFD54F';
  for (let i = 0; i < 8; i++) {
    const a = (i * 45) * Math.PI / 180;
    const sx = cx + 1.5 * Math.cos(a);
    const sy = cy + 1.5 * Math.sin(a);
    ctx.beginPath(); ctx.arc(sx, sy, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FF8F00'; ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();
}

function drawLionDance(ctx, cx, cy, size) {
  // Fur trim ring
  const furColors = ['#FFD54F','#FFB74D','#FF8A65','#EF5350','#FFD54F','#FFB74D'];
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * Math.PI * 2;
    const r = size * 0.45 + Math.random() * size * 0.15;
    const fx = cx + r * Math.cos(a);
    const fy = cy + r * Math.sin(a);
    ctx.fillStyle = furColors[Math.floor(Math.random() * furColors.length)];
    ctx.beginPath(); ctx.arc(fx, fy, 5 + Math.random()*4, 0, Math.PI*2); ctx.fill();
  }

  // Main face disc
  const faceGrad = ctx.createRadialGradient(cx, cy-5, size*0.05, cx, cy, size*0.42);
  faceGrad.addColorStop(0, '#FFE0B2');
  faceGrad.addColorStop(1, '#FFCC80');
  ctx.beginPath(); ctx.arc(cx, cy, size*0.4, 0, Math.PI*2);
  ctx.fillStyle = faceGrad; ctx.fill();
  ctx.strokeStyle = '#E65100'; ctx.lineWidth = 2.5; ctx.stroke();

  // Ears
  drawLionEar(ctx, cx - size*0.32, cy - size*0.18, size*0.16);
  drawLionEar(ctx, cx + size*0.32, cy - size*0.18, size*0.16);

  // Eye whites
  const eyeY = cy - size*0.1;
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.ellipse(cx - size*0.16, eyeY, size*0.11, size*0.13, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + size*0.16, eyeY, size*0.11, size*0.13, 0, 0, Math.PI*2); ctx.fill();

  // Pupils (big cute)
  ctx.fillStyle = '#1A1A1A';
  ctx.beginPath(); ctx.arc(cx - size*0.14, eyeY, size*0.07, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + size*0.14, eyeY, size*0.07, 0, Math.PI*2); ctx.fill();

  // Eye highlights
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(cx - size*0.17, eyeY - size*0.03, size*0.03, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + size*0.13, eyeY - size*0.03, size*0.03, 0, Math.PI*2); ctx.fill();

  // Eyebrows
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - size*0.28, eyeY - size*0.15);
  ctx.quadraticCurveTo(cx - size*0.16, eyeY - size*0.22, cx - size*0.04, eyeY - size*0.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + size*0.28, eyeY - size*0.15);
  ctx.quadraticCurveTo(cx + size*0.16, eyeY - size*0.22, cx + size*0.04, eyeY - size*0.1);
  ctx.stroke();

  // Nose (cute triangle)
  ctx.fillStyle = '#4E342E';
  ctx.beginPath();
  ctx.moveTo(cx - size*0.05, cy + size*0.03);
  ctx.lineTo(cx + size*0.05, cy + size*0.03);
  ctx.lineTo(cx, cy + size*0.09);
  ctx.closePath();
  ctx.fill();

  // Mouth (smile)
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy + size*0.05, size*0.1, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Cheek blush
  ctx.fillStyle = 'rgba(255,140,140,0.35)';
  ctx.beginPath(); ctx.ellipse(cx - size*0.26, cy + size*0.1, size*0.07, size*0.05, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + size*0.26, cy + size*0.1, size*0.07, size*0.05, 0, 0, Math.PI*2); ctx.fill();

  // Microphone below face
  const micY = cy + size*0.45;
  ctx.fillStyle = '#424242';
  ctx.beginPath(); ctx.arc(cx, micY - 6, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#757575';
  ctx.fillRect(cx - 3, micY - 6, 6, 18);
  ctx.fillStyle = '#424242';
  ctx.fillRect(cx - 5, micY + 10, 10, 4);

  // Mic sparkles
  ctx.fillStyle = '#FFD700';
  drawStar(ctx, cx - 14, micY - 12, 3, 4);
  drawStar(ctx, cx + 12, micY - 10, 2.5, 4);
  drawStar(ctx, cx, micY - 18, 3.5, 4);
}

function drawLionEar(ctx, cx, cy, size) {
  ctx.beginPath();
  ctx.arc(cx, cy, size, 0, Math.PI*2);
  const earGrad = ctx.createRadialGradient(cx, cy, size*0.2, cx, cy, size);
  earGrad.addColorStop(0, '#FFCC80');
  earGrad.addColorStop(1, '#F57C00');
  ctx.fillStyle = earGrad; ctx.fill();
  ctx.strokeStyle = '#E65100'; ctx.lineWidth = 2; ctx.stroke();
}

function drawStar(ctx, cx, cy, r, points) {
  const step = Math.PI / points;
  let rot = -Math.PI / 2;
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const cr = i % 2 === 0 ? r : r * 0.4;
    const x = cx + cr * Math.cos(rot);
    const y = cy + cr * Math.sin(rot);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    rot += step;
  }
  ctx.closePath(); ctx.fill();
}

function drawArcText(ctx, text, cx, cy, radius, color, font) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = font;
  const chars = text.split('');
  const totalAngle = (chars.length - 1) * 0.22;
  const startAngle = -Math.PI / 2 - totalAngle / 2;

  chars.forEach((ch, i) => {
    const a = startAngle + i * 0.22;
    const x = cx + radius * Math.cos(a);
    const y = cy + radius * Math.sin(a);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

// ===== Badge Page =====
function showBadge() {
  showPage('page-badge');
  setTimeout(() => {
    drawBadge();
    spawnConfetti();
  }, 200);
}

function spawnConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#C41E3A','#D4A843','#5B8C5A','#FFAB91','#5B9BD5','#F4A460','#E63946','#FFD700'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = -(Math.random() * 40) + 'px';
    el.style.width = (6 + Math.random() * 10) + 'px';
    el.style.height = (6 + Math.random() * 14) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 5000);
}

function saveBadge() {
  const canvas = document.getElementById('badgeCanvas');
  const link = document.createElement('a');
  link.download = '岭南歌唱达人徽章.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function restart() {
  currentLine = 0;
  fragments = [false, false, false, false];
  retryCount = 0;
  stopRecording();
  recognition = null;
  updateSingUI();
  showPage('page-sing');
  if (voiceMode) initSpeechRecognition();
}

// ===== QR Code (generated on load) =====
window.addEventListener('DOMContentLoaded', () => {
  const url = encodeURIComponent(window.location.href);
  const qrImg = document.getElementById('qrImg');
  if (qrImg && !window.location.href.startsWith('file://')) {
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + url;
    document.getElementById('qrSection').style.display = 'block';
  }
});
