<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>岭南小歌星 — 齐齐望过去</title>
<style>
:root {
  --red: #C41E3A; --gold: #D4A843; --green: #5B8C5A;
  --cream: #FFF8EC; --dark: #3D2C2C; --pink: #FFAB91;
  --blue: #5B9BD5; --orange: #F4A460;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans HK',sans-serif;
  background: linear-gradient(180deg, #FFF8EC 0%, #FFE8D6 50%, #FFD4B8 100%);
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.page { display:none; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh; padding:20px 16px; }
.page.active { display:flex; }

/* ===== Welcome ===== */
.welcome-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.welcome-bg .circle1 { position:absolute; top:-80px; right:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,171,145,0.25); }
.welcome-bg .circle2 { position:absolute; bottom:-40px; left:-50px; width:180px; height:180px; border-radius:50%; background:rgba(212,168,67,0.18); }
.welcome-inner { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
.welcome-animals { font-size:48px; letter-spacing:8px; margin-bottom:12px; animation: bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.title-card {
  background:#fff; border-radius:24px; padding:24px 32px;
  box-shadow: 0 8px 32px rgba(196,30,58,0.12);
  text-align:center; margin-bottom:20px;
}
.title-card .decor-line { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.title-card .decor-line span { font-size:22px; }
.title-main { font-size:34px; font-weight:900; color:var(--red); letter-spacing:4px; }
.title-sub { font-size:14px; color:var(--gold); font-weight:700; margin-top:4px; letter-spacing:2px; }
.step-preview { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
.step-dot {
  width:48px; height:48px; border-radius:50%; background:#fff;
  border:3px dashed #ddd; display:flex; align-items:center; justify-content:center;
  font-size:22px; transition:all 0.4s;
}
.step-dot.done { border-color:var(--gold); background:#FFF9E6; box-shadow:0 0 12px rgba(212,168,67,0.3); }
.btn-start {
  background:linear-gradient(135deg, #C41E3A, #E63946);
  color:#fff; border:none; padding:18px 60px; font-size:22px; font-weight:700;
  border-radius:50px; letter-spacing:3px; cursor:pointer;
  box-shadow:0 6px 24px rgba(196,30,58,0.4);
  transition:transform 0.15s;
}
.btn-start:active { transform:scale(0.95); }

/* ===== Step Header ===== */
.step-header { width:100%; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.btn-back { background:#fff; border:2px solid #eee; border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.step-indicator { flex:1; text-align:center; font-size:15px; font-weight:700; color:var(--red); letter-spacing:2px; }
.fragments-mini { display:flex; gap:6px; }
.frag-mini { width:24px; height:24px; border-radius:50%; border:2px dashed #ddd; background:#f9f9f9; transition:all 0.4s; font-size:12px; display:flex; align-items:center; justify-content:center; }
.frag-mini.got { border-color:var(--gold); background:#FFF9E6; box-shadow:0 0 8px rgba(212,168,67,0.3); }

/* ===== Step 1: Read ===== */
.vocab-card {
  width:100%; background:#fff; border-radius:20px; padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,0.06); text-align:center;
  margin-bottom:16px;
}
.vocab-img { width:160px; height:160px; object-fit:contain; margin-bottom:12px; }
.vocab-word { font-size:36px; font-weight:900; color:var(--dark); letter-spacing:4px; }
.vocab-counter { font-size:13px; color:#999; margin-top:6px; }
.vocab-nav { display:flex; gap:16px; align-items:center; margin-bottom:20px; }
.vocab-nav button { background:#fff; border:2px solid #eee; border-radius:50%; width:44px; height:44px; font-size:20px; cursor:pointer; }

/* ===== Step 2 & 3: Sing Along & Echo ===== */
.animal-display {
  width:100%; border-radius:20px; overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.1); margin-bottom:12px;
  aspect-ratio:16/10; position:relative;
}
.animal-display img { width:100%; height:100%; object-fit:cover; }
.animal-label {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent, rgba(0,0,0,0.5));
  color:#fff; padding:20px 16px 12px; font-size:16px; font-weight:700;
  text-align:center; letter-spacing:2px;
}
.lyric-mini {
  width:100%; display:flex; gap:6px; margin-bottom:8px; justify-content:center; flex-wrap:wrap;
}
.lyric-dot {
  padding:6px 14px; border-radius:20px; background:#f0f0f0;
  font-size:13px; color:#999; font-weight:600; transition:all 0.3s;
}
.lyric-dot.active { background:var(--red); color:#fff; }

/* ===== Step 4: Full Song ===== */
.mode-choose { display:flex; gap:12px; margin-bottom:16px; width:100%; }
.mode-btn {
  flex:1; padding:16px; border-radius:16px; border:3px solid #eee;
  background:#fff; text-align:center; cursor:pointer; transition:all 0.2s;
  font-size:16px; font-weight:700;
}
.mode-btn.selected { border-color:var(--red); background:#FFF5F5; }

/* ===== Recording Controls (shared) ===== */
.record-section { width:100%; text-align:center; }
.btn-record {
  width:80px; height:80px; border-radius:50%; border:none;
  background:linear-gradient(135deg, #C41E3A, #E63946);
  color:#fff; font-size:32px; cursor:pointer;
  box-shadow:0 6px 20px rgba(196,30,58,0.35);
  transition:all 0.2s;
}
.btn-record:active { transform:scale(0.9); }
.btn-record.recording {
  animation:recordPulse 0.8s ease-in-out infinite;
  background:linear-gradient(135deg, #ff1744, #ff5252);
}
@keyframes recordPulse {
  0% { box-shadow:0 0 0 0 rgba(255,23,68,0.5); }
  100% { box-shadow:0 0 0 28px rgba(255,23,68,0); }
}
.record-hint { font-size:14px; color:#888; margin-top:8px; }
.record-timer { font-size:12px; color:#aaa; margin-top:4px; }

.btn-action {
  margin-top:12px; padding:12px 36px; border-radius:25px;
  font-size:16px; font-weight:700; cursor:pointer; border:none;
  letter-spacing:1px;
}
.btn-primary { background:var(--red); color:#fff; box-shadow:0 4px 12px rgba(196,30,58,0.3); }
.btn-gold { background:var(--gold); color:#fff; box-shadow:0 4px 12px rgba(212,168,67,0.3); }
.btn-outline { background:#fff; color:var(--red); border:2px solid var(--red); }
.btn:disabled { opacity:0.4; pointer-events:none; }

/* ===== Badge Page ===== */
.badge-bg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; background:linear-gradient(180deg, #FFF9E6, #FFE8D6); }
.badge-inner { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.badge-img { width:260px; height:260px; object-fit:contain; border-radius:50%; box-shadow:0 8px 40px rgba(212,168,67,0.4); animation: popIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes popIn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
.badge-name { font-size:28px; font-weight:900; color:var(--red); margin-top:16px; letter-spacing:3px; }
.badge-desc { font-size:14px; color:#888; margin:6px 0 16px; }

.confetti-wrap { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.confetti { position:absolute; width:10px; height:10px; border-radius:2px; animation:confettiFall linear forwards; }
@keyframes confettiFall {
  0%{transform:translateY(-100px) rotate(0deg); opacity:1}
  100%{transform:translateY(105vh) rotate(720deg); opacity:0}
}
</style>
</head>
<body>

<!-- ===== Welcome Page ===== -->
<div id="page-welcome" class="page active">
  <div class="welcome-bg"><div class="circle1"></div><div class="circle2"></div></div>
  <div class="welcome-inner">
    <div class="welcome-animals">🐸 🐷 🐦 🦁</div>
    <div class="title-card">
      <div class="decor-line"><span>🏯</span><span>🌺</span><span>🎤</span></div>
      <div class="title-main">齐齐望过去</div>
      <div class="title-sub">粤语童谣 · 岭南小歌星挑战</div>
    </div>
    <div class="step-preview" id="stepDots">
      <div class="step-dot">📖</div><div class="step-dot">🎵</div><div class="step-dot">🎧</div><div class="step-dot">🌟</div>
    </div>
    <button class="btn-start" onclick="startChallenge()">开 始 挑 战</button>
  </div>
</div>

<!-- ===== Step 1: 念一念 ===== -->
<div id="page-read" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator">📖 第一关 · 念一念</span>
    <div class="fragments-mini" id="fragMini1"></div>
  </div>
  <div class="vocab-card" id="vocabCard">
    <img class="vocab-img" id="vocabImg" src="" alt="">
    <div class="vocab-word" id="vocabWord"></div>
    <div class="vocab-counter" id="vocabCounter"></div>
  </div>
  <div class="vocab-nav">
    <button id="btnPrevVocab" onclick="prevVocab()">◀</button>
    <button id="btnNextVocab" onclick="nextVocab()">▶</button>
  </div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord1" onclick="toggleRecord1()">🎤</button>
    <div class="record-hint" id="recordHint1">点按开始录音跟读</div>
    <div class="record-timer" id="recordTimer1"></div>
  </div>
  <button class="btn-action btn-gold" id="btnDoneRead" onclick="finishStep1()" style="display:none;">完成念一念，领取碎片 ✓</button>
</div>

<!-- ===== Step 2: 跟唱歌词 ===== -->
<div id="page-sing" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator">🎵 第二关 · 跟唱歌词</span>
    <div class="fragments-mini" id="fragMini2"></div>
  </div>
  <div class="lyric-mini" id="lyricDots"></div>
  <div class="animal-display" id="animalDisplay2">
    <img id="animalImg2" src="" alt="">
    <div class="animal-label" id="animalLabel2"></div>
  </div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord2" onclick="toggleRecord2()">🎤</button>
    <div class="record-hint" id="recordHint2">播放歌曲后，点按录音跟唱</div>
    <div class="record-timer" id="recordTimer2"></div>
  </div>
  <button class="btn-action btn-primary" id="btnPlay2" onclick="togglePlay2()">▶ 播放歌曲</button>
  <button class="btn-action btn-gold" id="btnDoneSing" onclick="finishStep2()" style="display:none;">完成跟唱，领取碎片 ✓</button>
</div>

<!-- ===== Step 3: 接唱 ===== -->
<div id="page-echo" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator" id="echoTitle">🎧 第三关 · 接唱后半句</span>
    <div class="fragments-mini" id="fragMini3"></div>
  </div>
  <div class="animal-display" id="animalDisplay3">
    <img id="animalImg3" src="" alt="">
    <div class="animal-label" id="animalLabel3">听前半句，接唱后半句</div>
  </div>
  <p style="font-size:14px;color:#888;text-align:center;margin-bottom:8px;" id="echoHint">🎧 仔细听，音乐停了就轮到你唱！</p>
  <div class="record-section">
    <button class="btn-record" id="btnRecord3" onclick="toggleRecord3()">🎤</button>
    <div class="record-hint" id="recordHint3">播放后自动开始录音</div>
    <div class="record-timer" id="recordTimer3"></div>
  </div>
  <button class="btn-action btn-primary" id="btnPlay3" onclick="togglePlay3()">▶ 播放接唱音乐</button>
  <button class="btn-action btn-gold" id="btnDoneEcho" onclick="finishStep3()" style="display:none;">完成接唱，领取碎片 ✓</button>
</div>

<!-- ===== Step 4: 唱整首 ===== -->
<div id="page-full" class="page">
  <div class="step-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="step-indicator">🌟 第四关 · 唱整首</span>
    <div class="fragments-mini" id="fragMini4"></div>
  </div>
  <div class="animal-display">
    <img src="images/phone/狮子.jpg" alt="" style="width:100%;height:100%;object-fit:cover;">
    <div class="animal-label">🎤 完整演唱《齐齐望过去》</div>
  </div>
  <p style="font-size:14px;color:#888;text-align:center;margin-bottom:8px;">选择演唱模式：</p>
  <div class="mode-choose">
    <div class="mode-btn selected" id="modeOriginal" onclick="selectMode('original')">🎵 跟唱原曲</div>
    <div class="mode-btn" id="modeAccompany" onclick="selectMode('accompany')">🎹 伴奏演唱</div>
  </div>
  <div class="record-section">
    <button class="btn-record" id="btnRecord4" onclick="toggleRecord4()">🎤</button>
    <div class="record-hint" id="recordHint4">点按录音，完整演唱</div>
    <div class="record-timer" id="recordTimer4"></div>
  </div>
  <button class="btn-action btn-primary" id="btnPlay4" onclick="togglePlay4()">▶ 播放音乐</button>
  <button class="btn-action btn-gold" id="btnDoneFull" onclick="finishStep4()" style="display:none;">完成演唱，领取碎片 ✓</button>
</div>

<!-- ===== Badge Page ===== -->
<div id="page-badge" class="page">
  <div class="badge-bg"></div>
  <div class="badge-inner">
    <img class="badge-img" src="images/badge.jpg" alt="岭南小歌星徽章" id="badgeFinal">
    <div class="badge-name">🎖 岭南小歌星 🎖</div>
    <div class="badge-desc">恭喜你完成了《齐齐望过去》所有挑战！</div>
    <button class="btn-action btn-gold" onclick="restartAll()" style="font-size:18px;padding:14px 40px;">再玩一次</button>
    <button class="btn-action btn-outline" onclick="saveBadge()" style="margin-top:8px;">保存徽章图片</button>
  </div>
  <div class="confetti-wrap" id="confettiWrap"></div>
</div>

<script>
// ===== DATA =====
const vocabList = [
  { word:'望过去', img:'images/vocab/望过去.png' },
  { word:'清溪',   img:'images/vocab/清溪.png' },
  { word:'青蛙',   img:'images/vocab/青蛙.png' },
  { word:'小屋',   img:'images/vocab/小屋.png' },
  { word:'猪仔',   img:'images/vocab/猪仔.png' },
  { word:'鹩哥',   img:'images/vocab/鹩哥.png' },
  { word:'驳嘴',   img:'images/vocab/驳嘴.png' },
  { word:'山窿',   img:'images/vocab/山窿.png' },
  { word:'狮子',   img:'images/vocab/狮子.png' },
];

const lyricLines = [
  { text:'齐齐望过去，清溪里有只青蛙想跳水', animal:'青蛙', img:'images/phone/青蛙.jpg' },
  { text:'齐齐望过去，小屋里有只猪仔真风趣', animal:'猪仔', img:'images/phone/猪仔.jpg' },
  { text:'有只鹩哥，吱吱喳喳想驳嘴',          animal:'鹩哥', img:'images/phone/鹩哥.jpg' },
  { text:'齐齐望过去，山窿里有只狮子竟饮醉', animal:'狮子', img:'images/phone/狮子.jpg' },
];

// Approximate lyric timestamps in full song (seconds)
const lyricTimes = [0, 14, 28, 42];

// ===== STATE =====
let fragments = [false, false, false, false]; // 4 step fragments
let currentVocab = 0;
let vocabRecorded = new Array(9).fill(false);
let echoRound = 0; // 0 = sing back half, 1 = sing front half
let fullSongMode = 'original'; // 'original' | 'accompany'

// Audio & Recording
let currentAudio = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordingForStep = null; // 'read','sing','echo','full'
let recordTimerInterval = null;
let recordSeconds = 0;

// ===== HELPERS =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateAllFragments() {
  for (let s = 1; s <= 4; s++) {
    const row = document.getElementById('fragMini' + s);
    if (!row) continue;
    row.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('span');
      d.className = 'frag-mini' + (fragments[i] ? ' got' : '');
      d.textContent = fragments[i] ? ['📖','🎵','🎧','🌟'][i] : '';
      row.appendChild(d);
    }
  }
  // Welcome page dots
  const dots = document.querySelectorAll('#stepDots .step-dot');
  dots.forEach((d, i) => { if (fragments[i]) d.classList.add('done'); });
}

function stopAllAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
}

function stopAllRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  mediaRecorder = null;
  recordedChunks = [];
  if (recordTimerInterval) { clearInterval(recordTimerInterval); recordTimerInterval = null; }
  recordSeconds = 0;
}

function startRecording(stepName) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('你的浏览器不支持录音功能，请使用 Chrome 或 Safari 打开。');
    return false;
  }
  stopAllRecording();
  recordedChunks = [];
  recordSeconds = 0;
  recordingForStep = stepName;

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (recordTimerInterval) { clearInterval(recordTimerInterval); recordTimerInterval = null; }
    };
    mediaRecorder.start();
    recordTimerInterval = setInterval(() => {
      recordSeconds++;
      updateRecordTimerDisplay();
    }, 1000);
    updateRecordUI(true);
  }).catch(err => {
    console.error('Mic error:', err);
    alert('无法访问麦克风，请检查权限设置。');
  });
  return true;
}

function stopRecordingAndSave() {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return null;
  return new Promise(resolve => {
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      resolve({ blob, url });
    };
    mediaRecorder.stop();
  });
}

function updateRecordUI(isRec) {
  const btnId = 'btnRecord' + ({read:'1',sing:'2',echo:'3',full:'4'}[recordingForStep]||'1');
  const hintId = 'recordHint' + ({read:'1',sing:'2',echo:'3',full:'4'}[recordingForStep]||'1');
  const btn = document.getElementById(btnId);
  const hint = document.getElementById(hintId);
  if (btn) { btn.classList.toggle('recording', isRec); btn.textContent = isRec ? '⏹' : '🎤'; }
  if (hint) { hint.textContent = isRec ? '正在录音中...' : '点按开始录音'; }
}

function updateRecordTimerDisplay() {
  const timerId = 'recordTimer' + ({read:'1',sing:'2',echo:'3',full:'4'}[recordingForStep]||'1');
  const el = document.getElementById(timerId);
  if (el) {
    const m = Math.floor(recordSeconds / 60);
    const s = recordSeconds % 60;
    el.textContent = '⏱ ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
}

// ===== NAVIGATION =====
function goHome() {
  stopAllAudio();
  stopAllRecording();
  updateRecordUI(false);
  showPage('page-welcome');
  updateAllFragments();
}

function startChallenge() {
  fragments = [false,false,false,false];
  currentVocab = 0;
  vocabRecorded = new Array(9).fill(false);
  echoRound = 0;
  fullSongMode = 'original';
  updateAllFragments();
  // Go to step 1
  showStep1();
}

// ===== STEP 1: 念一念 =====
function showStep1() {
  showPage('page-read');
  currentVocab = 0;
  updateVocabUI();
  updateAllFragments();
  document.getElementById('btnDoneRead').style.display = 'none';
}

function updateVocabUI() {
  const v = vocabList[currentVocab];
  document.getElementById('vocabImg').src = v.img;
  document.getElementById('vocabWord').textContent = v.word;
  document.getElementById('vocabCounter').textContent = (currentVocab + 1) + ' / ' + vocabList.length;
  document.getElementById('btnPrevVocab').disabled = (currentVocab === 0);
  document.getElementById('btnNextVocab').disabled = (currentVocab === vocabList.length - 1);
  document.getElementById('recordHint1').textContent = vocabRecorded[currentVocab] ? '✓ 已录音' : '点按开始录音跟读';
  // Show done button if all recorded
  if (vocabRecorded.every(x => x)) {
    document.getElementById('btnDoneRead').style.display = 'inline-block';
  }
}

function prevVocab() { if (currentVocab > 0) { currentVocab--; updateVocabUI(); } }
function nextVocab() { if (currentVocab < vocabList.length - 1) { currentVocab++; updateVocabUI(); } }

function toggleRecord1() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecordingAndSave().then(result => {
      vocabRecorded[currentVocab] = true;
      updateVocabUI();
      updateRecordUI(false);
    });
  } else {
    startRecording('read');
  }
}

function finishStep1() {
  stopAllRecording();
  updateRecordUI(false);
  fragments[0] = true;
  updateAllFragments();
  showStep2();
}

// ===== STEP 2: 跟唱歌词 =====
function showStep2() {
  showPage('page-sing');
  updateAllFragments();
  document.getElementById('btnDoneSing').style.display = 'none';
  // Build lyric dots
  const dots = document.getElementById('lyricDots');
  dots.innerHTML = '';
  lyricLines.forEach((l, i) => {
    const d = document.createElement('span');
    d.className = 'lyric-dot'; d.textContent = l.animal; d.id = 'lyricDot' + i;
    dots.appendChild(d);
  });
  // Show first animal
  updateAnimalDisplay2(0);
}

function updateAnimalDisplay2(idx) {
  const l = lyricLines[Math.min(idx, 3)];
  document.getElementById('animalImg2').src = l.img;
  document.getElementById('animalLabel2').textContent = l.text;
  document.querySelectorAll('.lyric-dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
    if (i < idx) d.style.background = 'var(--green)'; else if (i > idx) d.style.background = '#f0f0f0';
  });
}

function togglePlay2() {
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    document.getElementById('btnPlay2').textContent = '▶ 继续播放';
    return;
  }
  if (currentAudio && currentAudio.paused) {
    currentAudio.play();
    document.getElementById('btnPlay2').textContent = '⏸ 暂停';
    return;
  }
  stopAllAudio();
  currentAudio = new Audio('audio/full.mp3');
  let lastIdx = -1;
  currentAudio.ontimeupdate = () => {
    const t = currentAudio.currentTime;
    let idx = 0;
    for (let i = lyricTimes.length - 1; i >= 0; i--) {
      if (t >= lyricTimes[i]) { idx = i; break; }
    }
    if (idx !== lastIdx) { lastIdx = idx; updateAnimalDisplay2(idx); }
  };
  currentAudio.onended = () => {
    updateAnimalDisplay2(3);
    document.getElementById('btnPlay2').textContent = '▶ 重新播放';
    currentAudio = null;
    document.getElementById('btnDoneSing').style.display = 'inline-block';
  };
  currentAudio.play();
  document.getElementById('btnPlay2').textContent = '⏸ 暂停';
}

function toggleRecord2() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecordingAndSave().then(() => {
      updateRecordUI(false);
      document.getElementById('btnDoneSing').style.display = 'inline-block';
    });
  } else {
    startRecording('sing');
  }
}

function finishStep2() {
  stopAllAudio();
  stopAllRecording();
  updateRecordUI(false);
  fragments[1] = true;
  updateAllFragments();
  showStep3();
}

// ===== STEP 3: 接唱 =====
function showStep3() {
  showPage('page-echo');
  updateAllFragments();
  echoRound = 0;
  document.getElementById('btnDoneEcho').style.display = 'none';
  document.getElementById('btnPlay3').style.display = 'inline-block';
  updateEchoUI();
}

function updateEchoUI() {
  if (echoRound === 0) {
    document.getElementById('echoTitle').textContent = '🎧 第三关 · 接唱后半句';
    document.getElementById('animalLabel3').textContent = '🎧 听前半句，你来接唱后半句';
    document.getElementById('echoHint').textContent = '仔细听前半句，音乐停了就轮到你唱后半句！';
  } else {
    document.getElementById('echoTitle').textContent = '🎧 第三关 · 接唱前半句';
    document.getElementById('animalLabel3').textContent = '🎧 听后半句，你来接唱前半句';
    document.getElementById('echoHint').textContent = '仔细听后半句，音乐停了就轮到你唱前半句！';
  }
  document.getElementById('animalImg3').src = 'images/phone/鹩哥.jpg';
}

function togglePlay3() {
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    document.getElementById('btnPlay3').textContent = '▶ 继续播放';
    return;
  }
  if (currentAudio && currentAudio.paused) {
    currentAudio.play();
    document.getElementById('btnPlay3').textContent = '⏸ 暂停';
    return;
  }
  stopAllAudio();
  const audioFile = echoRound === 0 ? 'audio/echo-back.mp3' : 'audio/echo-front.mp3';
  currentAudio = new Audio(audioFile);
  currentAudio.onended = () => {
    document.getElementById('btnPlay3').textContent = '▶ 重新播放';
    currentAudio = null;
    document.getElementById('btnDoneEcho').style.display = 'inline-block';
  };
  currentAudio.play();
  document.getElementById('btnPlay3').textContent = '⏸ 暂停';
}

function toggleRecord3() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecordingAndSave().then(() => {
      updateRecordUI(false);
      document.getElementById('btnDoneEcho').style.display = 'inline-block';
    });
  } else {
    startRecording('echo');
  }
}

function finishStep3() {
  stopAllAudio();
  stopAllRecording();
  updateRecordUI(false);
  if (echoRound === 0) {
    // First round done, go to second round
    echoRound = 1;
    updateEchoUI();
    document.getElementById('btnDoneEcho').style.display = 'none';
    document.getElementById('btnPlay3').textContent = '▶ 播放接唱音乐';
  } else {
    fragments[2] = true;
    updateAllFragments();
    showStep4();
  }
}

// ===== STEP 4: 演唱整首 =====
function showStep4() {
  showPage('page-full');
  updateAllFragments();
  document.getElementById('btnDoneFull').style.display = 'none';
  document.getElementById('btnPlay4').textContent = '▶ 播放音乐';
  fullSongMode = 'original';
  document.getElementById('modeOriginal').classList.add('selected');
  document.getElementById('modeAccompany').classList.remove('selected');
}

function selectMode(mode) {
  fullSongMode = mode;
  document.getElementById('modeOriginal').classList.toggle('selected', mode === 'original');
  document.getElementById('modeAccompany').classList.toggle('selected', mode === 'accompany');
  stopAllAudio();
  document.getElementById('btnPlay4').textContent = '▶ 播放音乐';
}

function togglePlay4() {
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    document.getElementById('btnPlay4').textContent = '▶ 继续播放';
    return;
  }
  if (currentAudio && currentAudio.paused) {
    currentAudio.play();
    document.getElementById('btnPlay4').textContent = '⏸ 暂停';
    return;
  }
  stopAllAudio();
  const audioFile = fullSongMode === 'original' ? 'audio/full.mp3' : 'audio/accompany.mp3';
  currentAudio = new Audio(audioFile);
  currentAudio.onended = () => {
    document.getElementById('btnPlay4').textContent = '▶ 重新播放';
    currentAudio = null;
    document.getElementById('btnDoneFull').style.display = 'inline-block';
  };
  currentAudio.play();
  document.getElementById('btnPlay4').textContent = '⏸ 暂停';
}

function toggleRecord4() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecordingAndSave().then(() => {
      updateRecordUI(false);
      document.getElementById('btnDoneFull').style.display = 'inline-block';
    });
  } else {
    startRecording('full');
  }
}

function finishStep4() {
  stopAllAudio();
  stopAllRecording();
  updateRecordUI(false);
  fragments[3] = true;
  updateAllFragments();
  showBadge();
}

// ===== BADGE =====
function showBadge() {
  showPage('page-badge');
  updateAllFragments();
  spawnConfetti();
}

function spawnConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#C41E3A','#D4A843','#5B8C5A','#FFAB91','#5B9BD5','#F4A460','#E63946','#FFD700'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = -(Math.random() * 40) + 'px';
    el.style.width = (6 + Math.random() * 10) + 'px';
    el.style.height = (6 + Math.random() * 14) + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 5000);
}

function saveBadge() {
  const link = document.createElement('a');
  link.download = '岭南小歌星徽章.png';
  link.href = document.getElementById('badgeFinal').src;
  link.click();
}

function restartAll() {
  fragments = [false,false,false,false];
  vocabRecorded = new Array(9).fill(false);
  echoRound = 0;
  stopAllAudio();
  stopAllRecording();
  showPage('page-welcome');
  updateAllFragments();
}

// ===== INIT =====
updateAllFragments();
</script>
</body>
</html>
