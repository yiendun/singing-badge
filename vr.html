<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>齐齐望过去 · 场景探索</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'PingFang SC','Microsoft YaHei',sans-serif; touch-action:none; }
canvas { display:block; }

#loading {
  position:fixed; inset:0; background:#1a1a2e; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  z-index:100; color:#fff; font-size:18px; transition:opacity 0.5s;
}
#loading .spinner { width:50px; height:50px; border:3px solid rgba(255,255,255,0.2); border-top-color:#D4A843; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:16px; }
@keyframes spin { to{transform:rotate(360deg)} }

/* Hotspot */
.hs-dot {
  position:fixed; z-index:60; pointer-events:auto; cursor:pointer;
  width:60px; height:60px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,215,0,0.7) 0%, rgba(255,215,0,0.2) 50%, transparent 70%);
  transform:translate(-50%,-50%);
  animation: hsPulse 1.8s ease-in-out infinite;
  display:flex; align-items:center; justify-content:center;
}
.hs-dot::after {
  content:''; width:16px; height:16px; border-radius:50%;
  background:rgba(255,215,0,0.9); box-shadow:0 0 10px rgba(255,215,0,0.6);
}
@keyframes hsPulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }

.hs-label {
  position:fixed; z-index:61; pointer-events:none;
  color:#fff; font-size:15px; font-weight:700;
  text-shadow:0 0 8px rgba(0,0,0,0.8);
  transform:translate(-50%,-90px);
  text-align:center; white-space:nowrap;
}

/* Top bar */
#topbar {
  position:fixed; top:0; left:0; right:0; z-index:70;
  background:linear-gradient(rgba(0,0,0,0.5),transparent);
  padding:14px 16px; display:flex; align-items:center; gap:12px;
}
#topbar .title { color:#fff; font-size:16px; font-weight:700; letter-spacing:2px; flex:1; }
#topbar .btn {
  background:rgba(255,255,255,0.15); color:#fff; border:none;
  padding:8px 14px; border-radius:20px; font-size:12px; cursor:pointer;
}

/* Bottom hint */
#hint {
  position:fixed; bottom:60px; left:50%; transform:translateX(-50%); z-index:70;
  color:#fff; font-size:13px; background:rgba(0,0,0,0.45);
  padding:8px 20px; border-radius:20px; transition:opacity 0.8s;
}

/* Navigation arrow */
.nav-arrow {
  position:fixed; top:50%; transform:translateY(-50%); z-index:65;
  font-size:36px; color:rgba(255,255,255,0.7); pointer-events:auto; cursor:pointer;
  width:48px; height:48px; border-radius:50%; background:rgba(0,0,0,0.3);
  display:flex; align-items:center; justify-content:center;
  transition:all 0.3s;
}
.nav-arrow:active { background:rgba(212,168,67,0.5); color:#fff; }

/* Transition overlay */
#transition {
  position:fixed; inset:0; z-index:90; background:#000;
  opacity:0; pointer-events:none; transition:opacity 0.6s;
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>场景加载中...</div>
<div id="transition"></div>
<canvas id="c"></canvas>

<!-- Top bar -->
<div id="topbar">
  <span class="title" id="sceneTitle">🐸 清溪 · 青蛙</span>
  <button class="btn" onclick="toggleGyro()">📱 陀螺仪</button>
</div>

<!-- Hotspots -->
<div class="hs-dot" id="hsNext" style="right:8%;top:50%;" onclick="goNext()"></div>
<div class="hs-label" id="hsNextLabel" style="right:8%;top:50%;">去看看小猪 🐷</div>

<div class="hs-dot" id="hsPrev" style="left:8%;top:50%;display:none;" onclick="goPrev()"></div>
<div class="hs-label" id="hsPrevLabel" style="left:8%;top:50%;display:none;">回去看青蛙 🐸</div>

<div id="hint">👈 拖动画面，点击光圈探索新场景</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ===== SCENE DATA =====
const scenes = [
  { id:'frog', name:'🐸 清溪 · 青蛙', img:'vr/青蛙.jpg', next:1, prev:null },
  { id:'pig',  name:'🐷 小屋 · 猪仔', img:'vr/小猪.jpg',  next:null, prev:0 },
];
let currentIdx = 0;

// ===== THREE.JS =====
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 0);
const scene3d = new THREE.Scene();
const loader = new THREE.TextureLoader();

let cylinder = null;
let texture = null;
let curLon = 0, targetLon = 0;
let isDragging = false, lastX = 0;
let useGyro = false;
let gyroBase = 0;

// ===== CREATE SCENE =====
function buildCylinder() {
  if (cylinder) { scene3d.remove(cylinder); cylinder.geometry.dispose(); }
  if (texture) texture.dispose();

  // Cylinder arc covering ~120 degrees
  const geom = new THREE.CylinderGeometry(8, 8, 6, 48, 1, true, THREE.MathUtils.degToRad(180), THREE.MathUtils.degToRad(220));
  const mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
  cylinder = new THREE.Mesh(geom, mat);
  cylinder.rotation.y = THREE.MathUtils.degToRad(20);
  scene3d.add(cylinder);
}

function loadScene(idx) {
  currentIdx = idx;
  const data = scenes[idx];
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading').style.opacity = '1';
  document.getElementById('sceneTitle').textContent = data.name;
  curLon = 0; targetLon = 0;

  updateNavUI();

  loader.load(data.img, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    texture = tex;
    if (!cylinder) buildCylinder();
    cylinder.material.map = tex;
    cylinder.material.needsUpdate = true;
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
  });
}

function updateNavUI() {
  const d = scenes[currentIdx];
  document.getElementById('hsNext').style.display = d.next !== null ? 'flex' : 'none';
  document.getElementById('hsNextLabel').style.display = d.next !== null ? 'block' : 'none';
  document.getElementById('hsPrev').style.display = d.prev !== null ? 'flex' : 'none';
  document.getElementById('hsPrevLabel').style.display = d.prev !== null ? 'block' : 'none';
}

// ===== NAVIGATION =====
function transitionTo(idx) {
  const overlay = document.getElementById('transition');
  overlay.style.opacity = '1';
  setTimeout(() => {
    loadScene(idx);
    curLon = 0; targetLon = 0;
    setTimeout(() => { overlay.style.opacity = '0'; }, 300);
  }, 600);
}

window.goNext = () => {
  const next = scenes[currentIdx].next;
  if (next !== null) transitionTo(next);
};
window.goPrev = () => {
  const prev = scenes[currentIdx].prev;
  if (prev !== null) transitionTo(prev);
};

// ===== INPUT =====
canvas.addEventListener('pointerdown', e => {
  isDragging = true;
  lastX = e.clientX;
  document.getElementById('hint').style.opacity = '0';
});
canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  targetLon += dx * 0.15;
  lastX = e.clientX;
});
canvas.addEventListener('pointerup', () => { isDragging = false; });
canvas.addEventListener('pointerleave', () => { isDragging = false; });

// Touch events for hotspot clicks (prevent canvas from eating them)
document.getElementById('hsNext').addEventListener('pointerdown', e => { e.stopPropagation(); });
document.getElementById('hsPrev').addEventListener('pointerdown', e => { e.stopPropagation(); });

// ===== GYROSCOPE =====
window.toggleGyro = () => {
  useGyro = !useGyro;
  document.querySelector('#topbar .btn').textContent = useGyro ? '📱 陀螺仪:开' : '📱 陀螺仪';
  if (useGyro) {
    if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') window.addEventListener('deviceorientation', onOrientation);
      }).catch(() => {});
    } else {
      window.addEventListener('deviceorientation', onOrientation);
    }
  } else {
    window.removeEventListener('deviceorientation', onOrientation);
  }
};

function onOrientation(e) {
  if (!useGyro || isDragging) return;
  if (e.alpha !== null) targetLon = -(e.alpha - gyroBase) * 3;
}

// ===== RESIZE =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== KEYBOARD =====
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'ArrowRight') goNext();
});

// ===== ANIMATION LOOP =====
function animate() {
  requestAnimationFrame(animate);
  // Smooth lerp towards target rotation
  curLon += (targetLon - curLon) * 0.1;
  camera.rotation.y = THREE.MathUtils.degToRad(curLon);
  renderer.render(scene3d, camera);
}

// ===== START =====
buildCylinder();
loadScene(0);
animate();
</script>
</body>
</html>
