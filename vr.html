<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>齐齐望过去 · 全景探索</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'PingFang SC','Microsoft YaHei',sans-serif; touch-action:none; -webkit-touch-callout:none; }
canvas { display:block; position:fixed; top:0; left:0; width:100%; height:100%; }

#loading {
  position:fixed; inset:0; background:#111; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  z-index:100; color:#fff; font-size:16px; transition:opacity 0.6s;
}
#loading .ring { width:44px; height:44px; border:3px solid rgba(255,255,255,0.15); border-top-color:#D4A843; border-radius:50%; animation:spin 0.9s linear infinite; margin-bottom:14px; }
@keyframes spin { to{transform:rotate(360deg)} }

/* ===== Bottom Navigation Dots ===== */
#nav-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:80;
  background:linear-gradient(transparent, rgba(0,0,0,0.7));
  padding:50px 16px 24px; display:flex; justify-content:center;
  gap:20px; pointer-events:none;
}
.nav-dot-wrap {
  pointer-events:auto; display:flex; flex-direction:column;
  align-items:center; gap:6px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.nav-dot {
  width:44px; height:44px; border-radius:50%; border:2px solid rgba(255,255,255,0.4);
  background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center;
  font-size:22px; transition:all 0.35s;
}
.nav-dot.active {
  border-color:#D4A843; background:rgba(212,168,67,0.3);
  box-shadow:0 0 16px rgba(212,168,67,0.5); transform:scale(1.15);
}
.nav-dot-label { color:#fff; font-size:11px; font-weight:600; text-align:center; transition:color 0.35s; }
.nav-dot.active + .nav-dot-label { color:#D4A843; }

/* ===== Hint ===== */
#hint {
  position:fixed; bottom:140px; left:50%; transform:translateX(-50%); z-index:80;
  color:#fff; font-size:12px; background:rgba(0,0,0,0.45);
  padding:6px 18px; border-radius:16px; pointer-events:none;
  transition:opacity 0.8s;
}

/* ===== Music Note Button ===== */
#music-btn {
  position:fixed; top:80px; right:20px; z-index:85;
  width:52px; height:52px; border-radius:50%; cursor:pointer;
  background:rgba(212,168,67,0.8); border:2px solid rgba(255,255,255,0.5);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; box-shadow:0 0 20px rgba(212,168,67,0.4);
  animation: noteFloat 2.5s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}
#music-btn.playing {
  background:rgba(196,30,58,0.85);
  animation: notePulse 0.6s ease-in-out infinite;
}
@keyframes noteFloat {
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}
@keyframes notePulse {
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.15); }
}
@keyframes hsBlink {
  0%,100%{ transform:scale(1); opacity:0.85; }
  50%{ transform:scale(1.4); opacity:1; }
}
</style>
</head>
<body>

<div id="loading"><div class="ring"></div>场景加载中...</div>
<button id="music-btn" onclick="toggleMusic()">🎵</button>
<div id="hint">👆 拖动探索 · 点击底部圆点切换场景</div>

<!-- Navigation dots -->
<div id="nav-bar"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ===== SCENE DATA =====
const scenes = [
  { id:'frog',  label:'青蛙', icon:'🐸', img:'vr/青蛙.jpg', audio:'vr/青蛙.mp3' },
  { id:'pig',   label:'小猪', icon:'🐷', img:'vr/狮子.jpg', audio:'vr/小猪.mp3' },
  { id:'myna',  label:'鹩哥', icon:'🐦', img:'vr/鹩哥.jpg', audio:'vr/鹩哥.mp3' },
  { id:'lion',  label:'狮子', icon:'🦁', img:'vr/小猪.jpg', audio:'vr/狮子.mp3' },
];

// ===== THREE.JS =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene3d = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(0, 0, 0);

const loader = new THREE.TextureLoader();

// ===== BUILD CURVED GALLERY =====
const R = 5;       // Cylinder radius
const H = 8;       // Tall cylinder fills vertical space

const textures = [];

function loadAll() {
  let loaded = 0;
  const total = scenes.length;
  const promises = scenes.map((s, i) => new Promise(resolve => {
    loader.load(s.img, tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      textures[i] = tex;
      loaded++;
      if (loaded >= total) {
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
      }
      resolve();
    });
  }));
  Promise.all(promises).then(() => buildRoom());
}

function buildRoom() {
  const total = scenes.length;
  const segAngle = (Math.PI * 2) / total;

  // Wall segments - each image on a 90° arc
  for (let i = 0; i < total; i++) {
    const geom = new THREE.CylinderGeometry(R, R, H, 32, 1, true, i * segAngle, segAngle);
    const mat = new THREE.MeshBasicMaterial({ map: textures[i], side: THREE.BackSide });
    const seg = new THREE.Mesh(geom, mat);
    scene3d.add(seg);
  }

  // Bottom cap
  const bGeom = new THREE.CircleGeometry(R, 48);
  const bMat = new THREE.MeshBasicMaterial({ color: 0x1a1210, side: THREE.DoubleSide });
  const bottom = new THREE.Mesh(bGeom, bMat);
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.y = -H/2;
  scene3d.add(bottom);

  // Top cap
  const tGeom = new THREE.CircleGeometry(R, 48);
  const tMat = new THREE.MeshBasicMaterial({ color: 0x0d0a06, side: THREE.DoubleSide });
  const top = new THREE.Mesh(tGeom, tMat);
  top.rotation.x = Math.PI / 2;
  top.position.y = H/2;
  scene3d.add(top);

  buildNav();
  createHotspotMarkers();
}

// ===== BOTTOM NAV DOTS =====
function buildNav() {
  const bar = document.getElementById('nav-bar');
  bar.innerHTML = '';
  scenes.forEach((s, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'nav-dot-wrap';
    wrap.onclick = () => goTo(i);

    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === currentScene ? ' active' : '');
    dot.textContent = s.icon;
    dot.id = 'dot-' + i;

    const label = document.createElement('div');
    label.className = 'nav-dot-label';
    label.textContent = s.label;

    wrap.appendChild(dot);
    wrap.appendChild(label);
    bar.appendChild(wrap);
  });
}

function updateNavHighlight(idx) {
  for (let i = 0; i < scenes.length; i++) {
    const dot = document.getElementById('dot-' + i);
    if (dot) dot.classList.toggle('active', i === idx);
  }
}

// ===== HOTSPOT DATA =====
// Coordinates as percentages, audio file names
const hotspotData = {
  0: [ // 青蛙 scene
    { x:26, y:63.6, label:'青蛙', audio:'vr/vocab-audio/重点词汇-青蛙.mp3' },
    { x:52.3, y:66.7, label:'清溪', audio:'vr/vocab-audio/重点词汇-清溪.mp3' },
  ],
  1: [ // 小猪 scene
    { x:20.8, y:63.2, label:'小猪', audio:'vr/vocab-audio/重点词汇-小猪.mp3' },
    { x:16.5, y:16.5, label:'小屋', audio:'vr/vocab-audio/重点词汇-小屋.mp3' },
  ],
  2: [ // 鹩哥 scene
    { x:38.5, y:55.6, label:'鹩哥', audio:'vr/vocab-audio/重点词汇-鹩哥.mp3' },
  ],
  3: [ // 狮子 scene
    { x:70.5, y:16, label:'山窿', audio:'vr/vocab-audio/重点词汇-山窿.mp3' },
    { x:61.3, y:52.5, label:'狮子', audio:'vr/vocab-audio/重点词汇-狮子.mp3' },
  ],
};

const hsMarkers = []; // {el, pos3d, label, audio}
const hsContainer = document.createElement('div');
hsContainer.id = 'hs-labels';
hsContainer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:75;';
document.body.appendChild(hsContainer);

let hsAudio = null;

function createHotspotMarkers() {
  // Clear old
  hsMarkers.length = 0;
  hsContainer.innerHTML = '';
  const sceneHs = hotspotData[currentScene] || [];
  const segStart = currentScene * (Math.PI/2); // Cylinder segment start angle
  const segLen = Math.PI / 2;
  sceneHs.forEach(hs => {
    // Map percentage to cylinder angle (mirrored: BackSide flips L/R)
    const angle = segStart + ((100 - hs.x) / 100) * segLen;
    // y%: 0=top, 100=bottom of cylinder (y goes from -H/2 to +H/2)
    const yPos = (0.5 - hs.y / 100) * H;
    const xPos = R * Math.cos(angle);
    const zPos = R * Math.sin(angle);
    const pos3d = new THREE.Vector3(xPos, yPos, zPos);

    // Create CSS label
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);text-align:center;z-index:76;';
    el.innerHTML = '<span style="display:block;width:14px;height:14px;border-radius:50%;background:rgba(255,215,0,0.85);margin:0 auto 2px;box-shadow:0 0 10px rgba(255,215,0,0.6);animation:hsBlink 1.5s ease-in-out infinite;"></span><span style="color:#fff;font-size:11px;font-weight:700;text-shadow:0 0 6px rgba(0,0,0,0.8);white-space:nowrap;">'+hs.label+'</span>';
    el.addEventListener('click', (e) => { e.stopPropagation(); playHotspotAudio(hs); });
    el.addEventListener('touchend', (e) => { e.stopPropagation(); playHotspotAudio(hs); });
    hsContainer.appendChild(el);
    hsMarkers.push({ el, pos3d, label:hs.label, audio:hs.audio });
  });
}

function playHotspotAudio(hs) {
  if (hsAudio) { hsAudio.pause(); hsAudio = null; }
  hsAudio = new Audio(hs.audio);
  hsAudio.volume = 0.7;
  hsAudio.play().catch(() => {});
  // Brief visual feedback
  const el = document.querySelector('#hs-labels div');
}

function updateHotspotProjection() {
  const halfW = window.innerWidth / 2;
  const halfH = window.innerHeight / 2;
  hsMarkers.forEach(m => {
    const v = m.pos3d.clone();
    v.project(camera);
    const sx = (v.x * halfW) + halfW;
    const sy = -(v.y * halfH) + halfH;
    const behindCamera = v.z > 1;
    m.el.style.left = sx + 'px';
    m.el.style.top = sy + 'px';
    m.el.style.opacity = behindCamera ? '0' : '1';
  });
}

// ===== NAVIGATION =====
let currentScene = 0;

function goTo(idx) {
  currentScene = idx;
  targetLon = 45 - idx * 90;
  updateNavHighlight(idx);
  createHotspotMarkers();
}
window.goTo = goTo;

// ===== INPUT =====
let isDragging = false, lastX = 0, lastY = 0;
let lon = 45, targetLon = 45; // Start at first scene (frog)
let lat = 0, targetLat = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
  document.getElementById('hint').style.opacity = '0';
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!isDragging) return;
  targetLon += (e.clientX - lastX) * 0.15;
  targetLat -= (e.clientY - lastY) * 0.08;
  targetLat = Math.max(-35, Math.min(35, targetLat));
  lastX = e.clientX; lastY = e.clientY;
});

renderer.domElement.addEventListener('pointerup', () => { isDragging = false; });
renderer.domElement.addEventListener('pointerleave', () => { isDragging = false; });

// Wheel zoom (desktop)
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camera.fov = Math.max(50, Math.min(100, camera.fov + e.deltaY * 0.05));
  camera.updateProjectionMatrix();
}, { passive: false });

// ===== RESIZE =====
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  // Adjust FOV so cylinder fills screen vertically on narrow mobile screens
  if (w / h < 0.7) {
    camera.fov = 78;
  } else {
    camera.fov = 65;
  }
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize(); // Run immediately
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

// ===== ANIMATE =====
function animate() {
  requestAnimationFrame(animate);

  // Smooth lerp
  lon += (targetLon - lon) * 0.1;
  lat += (targetLat - lat) * 0.1;

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);

  const r = 0.01;
  camera.lookAt(
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.cos(theta)
  );

  renderer.render(scene3d, camera);
  updateHotspotProjection();
}

// ===== AUDIO =====
let audioEl = null;
let fadeTimer = null;
let musicPlaying = false;

function getAudio() {
  if (!audioEl) {
    audioEl = new Audio();
    audioEl.preload = 'auto';
  }
  return audioEl;
}

function stopAudio() {
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  const a = getAudio();
  a.onended = null;
  a.onerror = null;
  a.pause();
  a.currentTime = 0;
  musicPlaying = false;
  updateMusicBtn();
}

function fadeOut(dur) {
  if (!musicPlaying) return;
  const a = getAudio();
  if (a.paused || a.readyState === 0) { stopAudio(); return; }
  if (fadeTimer) clearInterval(fadeTimer);
  const sv = a.volume;
  const steps = 15;
  const ival = (dur * 1000) / steps;
  let n = 0;
  fadeTimer = setInterval(() => {
    n++;
    a.volume = Math.max(0, sv * (1 - n / steps));
    if (n >= steps) { clearInterval(fadeTimer); fadeTimer = null; stopAudio(); }
  }, ival);
}

function playCurrentSceneAudio() {
  const a = getAudio();
  // Clean up previous
  a.onended = null;
  a.onerror = null;
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  a.pause();

  const url = scenes[currentScene].audio;
  a.src = url;
  a.volume = 0.6;
  musicPlaying = false;
  updateMusicBtn();

  a.oncanplaythrough = () => {
    a.oncanplaythrough = null;
    a.play().then(() => {
      musicPlaying = true;
      updateMusicBtn();
    }).catch(() => {
      musicPlaying = false;
      updateMusicBtn();
    });
  };
  a.onended = () => { musicPlaying = false; updateMusicBtn(); };
  a.onerror = () => { musicPlaying = false; updateMusicBtn(); };
  a.load();
}

function toggleMusic() {
  if (musicPlaying) {
    fadeOut(0.8);
  } else {
    playCurrentSceneAudio();
  }
}
window.toggleMusic = toggleMusic;

function updateMusicBtn() {
  const btn = document.getElementById('music-btn');
  if (!btn) return;
  btn.textContent = musicPlaying ? '🎶' : '🎵';
  btn.classList.toggle('playing', musicPlaying);
}

const _goTo = goTo;
goTo = function(idx) {
  if (musicPlaying) fadeOut(0.6);
  else stopAudio();
  _goTo(idx);
};
window.goTo = goTo;

// ===== START =====
loadAll();
animate();
</script>
</body>
</html>
