<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>齐齐望过去 · 360° 全景探索</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
canvas { display:block; }

#loading {
  position:fixed; inset:0; background:#111; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  z-index:100; color:#fff; font-size:16px; transition:opacity 0.6s;
}
#loading .ring { width:44px; height:44px; border:3px solid rgba(255,255,255,0.15); border-top-color:#D4A843; border-radius:50%; animation:spin 0.9s linear infinite; margin-bottom:14px; }
@keyframes spin { to{transform:rotate(360deg)} }

#hint {
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%); z-index:80;
  color:#fff; font-size:13px; background:rgba(0,0,0,0.5);
  padding:7px 22px; border-radius:18px; pointer-events:none;
  transition:opacity 0.8s;
}

#topbar {
  position:fixed; top:0; left:0; right:0; z-index:80;
  background:linear-gradient(rgba(0,0,0,0.55),transparent);
  padding:12px 14px; display:flex; align-items:center; gap:10px;
}
#topbar .title { color:#fff; font-size:15px; font-weight:700; letter-spacing:2px; flex:1; }
#topbar .btn {
  background:rgba(255,255,255,0.12); color:#fff; border:none;
  padding:7px 13px; border-radius:18px; font-size:12px; cursor:pointer;
}
</style>
</head>
<body>

<div id="loading"><div class="ring"></div>360° 场景加载中...</div>
<div id="hint">👆 拖动画面 · 环顾四周</div>

<div id="topbar">
  <span class="title">🏯 齐齐望过去 · 360° 全景</span>
  <button class="btn" onclick="toggleVR()">🥽 VR</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ===== IMAGES (4 walls around user) =====
const imgFiles = [
  'vr/a6f0592a292847b52698cb9b451c55ef.jpg',
  'vr/a7e9c6608e86ed9f8a958c7f57768d09.jpg',
  'vr/小猪.jpg',
  'vr/青蛙.jpg',
];

// ===== THREE.JS SETUP =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(0, 1.5, 0);

const loader = new THREE.TextureLoader();
let loaded = 0;

// ===== CREATE 360° CUBE ROOM =====
const SIZE = 12; // Room size
const HEIGHT = 5;
const walls = []; // Store for later cleanup

function createRoom() {
  const texPromises = imgFiles.map(f => new Promise(resolve => {
    loader.load(f, tex => {
      tex.colorSpace = THREE.SRGBColorSpace;
      loaded++;
      if (loaded >= 4) {
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
      }
      resolve(tex);
    });
  }));

  Promise.all(texPromises).then(textures => {
    // 4 walls arranged in a square around the viewer
    // Front (0°), Right (90°), Back (180°), Left (270°)
    const positions = [
      { x:0, z:-SIZE/2, ry:0 },           // Front
      { x:SIZE/2, z:0, ry:Math.PI/2 },     // Right
      { x:0, z:SIZE/2, ry:Math.PI },       // Back
      { x:-SIZE/2, z:0, ry:-Math.PI/2 },   // Left
    ];

    textures.forEach((tex, i) => {
      const aspect = tex.image.width / tex.image.height;
      const wallW = SIZE;
      const wallH = wallW / aspect;
      const geom = new THREE.PlaneGeometry(wallW, wallH);
      const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
      const wall = new THREE.Mesh(geom, mat);
      wall.position.set(positions[i].x, HEIGHT/2, positions[i].z);
      wall.rotation.y = positions[i].ry;
      walls.push(wall);
      scene.add(wall);
    });

    // Add floor
    const floorGeom = new THREE.PlaneGeometry(SIZE, SIZE);
    const floorMat = new THREE.MeshBasicMaterial({ color: 0x2a1f0e, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeom, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -HEIGHT/4;
    scene.add(floor);
    walls.push(floor);

    // Add ceiling
    const ceilGeom = new THREE.PlaneGeometry(SIZE, SIZE);
    const ceilMat = new THREE.MeshBasicMaterial({ color: 0x1a1510, side: THREE.DoubleSide });
    const ceil = new THREE.Mesh(ceilGeom, ceilMat);
    ceil.rotation.x = Math.PI / 2;
    ceil.position.y = HEIGHT * 0.9;
    scene.add(ceil);
    walls.push(ceil);
  });
}

// ===== INPUT =====
let isDragging = false, lastX = 0, lastY = 0;
let lon = 0, lat = 0;
let targetLon = 0, targetLat = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
  document.getElementById('hint').style.opacity = '0';
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!isDragging) return;
  targetLon += (e.clientX - lastX) * 0.25;
  targetLat -= (e.clientY - lastY) * 0.15;
  targetLat = Math.max(-40, Math.min(40, targetLat));
  lastX = e.clientX; lastY = e.clientY;
});

renderer.domElement.addEventListener('pointerup', () => { isDragging = false; });
renderer.domElement.addEventListener('pointerleave', () => { isDragging = false; });

// ===== VR MODE =====
window.toggleVR = () => {
  if (!('xr' in navigator) || !navigator.xr) {
    alert('你的设备不支持 VR 模式');
    return;
  }
  navigator.xr.isSessionSupported('immersive-vr').then(supported => {
    if (supported) {
      renderer.xr.getSession().then(s => renderer.xr.setSession(s));
    } else {
      alert('你的设备不支持沉浸式 VR');
    }
  }).catch(() => {});
};

// ===== GYROSCOPE (mobile) =====
let gyroOn = false;
window.addEventListener('deviceorientation', e => {
  if (!gyroOn || isDragging) return;
  if (e.alpha !== null) targetLon = -e.alpha;
  if (e.beta !== null) targetLat = e.beta - 30;
});

// ===== RESIZE =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== ANIMATE =====
function animate() {
  requestAnimationFrame(animate);

  // Smooth lerp
  lon += (targetLon - lon) * 0.08;
  lat += (targetLat - lat) * 0.08;

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);

  // Look around from center
  const r = 0.01;
  const x = r * Math.sin(phi) * Math.sin(theta);
  const y = r * Math.cos(phi);
  const z = r * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(x, y + 1.5, z);

  renderer.render(scene, camera);
}

// ===== START =====
createRoom();
animate();
</script>
</body>
</html>
